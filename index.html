<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#fff4f8;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif}
#app{height:100dvh;display:flex;flex-direction:column}
header{height:calc(52px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 8px 4px;display:grid;grid-template-columns:42px 1fr 42px;align-items:center;background:#fff9fc;z-index:10}
header button{height:38px;border:0;border-radius:12px;background:#fff;box-shadow:0 2px 8px #0001;color:#77566a;font-size:19px;font-weight:900}
#dots{text-align:center;font-size:14px;letter-spacing:4px;color:#d8b7c7}
#game{flex:1;min-height:0;position:relative}
canvas{width:100%;height:100%;display:block;touch-action:none}
#meter{position:absolute;left:10%;right:10%;top:8px;height:8px;border-radius:20px;background:#ffffffad;overflow:hidden;box-shadow:0 2px 8px #0001;z-index:4}
#fill{height:100%;width:0;background:linear-gradient(90deg,#ffd34e,#ff70a9);transition:.08s}
#toast{position:absolute;left:50%;top:88px;transform:translateX(-50%);background:#fff;border-radius:30px;padding:7px 15px;font-weight:900;color:#704b5d;box-shadow:0 4px 14px #0002;opacity:0;transition:.18s;white-space:nowrap;z-index:5}
#toast.on{opacity:1}
#guide{position:absolute;left:50%;top:52px;transform:translateX(-50%);width:min(88%,620px);padding:7px 12px;border-radius:14px;background:#fffdf4e8;color:#6d5360;font-size:12px;font-weight:800;text-align:center;box-shadow:0 2px 10px #0001;z-index:4;pointer-events:none}
#decorControls{display:none;position:absolute;right:12px;bottom:14px;gap:8px;z-index:8}
#decorControls button{border:0;border-radius:16px;padding:11px 14px;font-weight:900;font-size:14px;box-shadow:0 3px 10px #0002}
#undoBtn{background:#fff;color:#795a69}
#finishBtn{background:#ff78aa;color:#fff}
#finalCard{display:none;position:absolute;left:3%;right:3%;top:48px;min-height:138px;z-index:12;background:#fffdfbea;border-radius:24px;box-shadow:0 8px 26px #0002;padding:8px 12px;align-items:center;gap:8px}
#finalCard.show{display:grid;grid-template-columns:78px minmax(0,1fr) 78px}
#finalCard .princessStage{position:relative;height:96px;display:flex;align-items:center;justify-content:center;background:linear-gradient(#fff8fd,#fff3cf);border-radius:18px;overflow:hidden;margin:0}
#finalCard .princess{font-size:58px;line-height:1;filter:drop-shadow(0 3px 5px #0002);animation:royalPop .65s ease-out}
#finalCard .accessories{display:none}
#finalCard .sparkles{position:absolute;inset:4px;font-size:15px;color:#e2ae2f;letter-spacing:4px;animation:twinkle .8s infinite alternate}
#unlockText{margin-top:3px;color:#c17496!important}
@keyframes royalPop{from{opacity:0;transform:scale(.45) translateY(25px)}to{opacity:1;transform:scale(1) translateY(0)}}
@keyframes twinkle{from{opacity:.35;transform:scale(.92)}to{opacity:1;transform:scale(1.08)}}
#finalCard .resultCopy{text-align:center;min-width:0}
#finalCard .big{font-size:17px;line-height:1.15;overflow-wrap:anywhere;font-weight:1000;color:#7e526c;margin:0 0 3px}
#finalCard .small{font-size:11px;font-weight:800;color:#8d7180;line-height:1.25;overflow-wrap:anywhere}
#finalCard button{margin:0;border:0;border-radius:15px;background:#ff78aa;color:#fff;font-weight:900;font-size:11px;line-height:1.15;padding:10px 5px;white-space:normal}
#photoLabel{display:none;position:absolute;left:50%;bottom:10px;transform:translateX(-50%);z-index:10;background:#fffdf0ee;border-radius:18px;padding:7px 14px;color:#7d596c;font-size:12px;font-weight:900;box-shadow:0 2px 10px #0001;pointer-events:none;white-space:nowrap}

#qualityBadge{position:absolute;left:50%;top:20px;transform:translateX(-50%);z-index:8;
font:900 10px/1.2 -apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;letter-spacing:.08em;
color:#b5748e;background:#fff9fbd9;border:1px solid #f4d6e3;border-radius:999px;padding:5px 12px;
box-shadow:0 3px 12px #c98aa522;pointer-events:none;white-space:nowrap}


#buildBadge{position:absolute;left:8px;top:8px;z-index:20;background:#9b5b7b;color:#fff;
font:900 11px sans-serif;padding:5px 8px;border-radius:10px;pointer-events:none;box-shadow:0 2px 8px #0002}

#buildBadge{right:8px!important;left:auto!important;top:8px!important;background:#d84b87!important;font-size:13px!important;padding:7px 10px!important}

<script>
const c=document.querySelector("#c"),ctx=c.getContext("2d");
const fill=document.querySelector("#fill"),dots=document.querySelector("#dots"),toast=document.querySelector("#toast"),guide=document.querySelector("#guide"),decorControls=document.querySelector("#decorControls"),finalCard=document.querySelector("#finalCard"),resultTitle=document.querySelector("#resultTitle"),resultText=document.querySelector("#resultText"),princessAvatar=document.querySelector("#princessAvatar"),accessories=document.querySelector("#accessories"),unlockText=document.querySelector("#unlockText"),sparkles=document.querySelector("#sparkles"),photoLabel=document.querySelector("#photoLabel");
let W=0,H=0,D=1,sound=true,audio=null,stage=0,drag=null,locked=false,stageStart=performance.now();
const EASY_MODE=true;
let transition=null,lastFrame=performance.now(),transitionFinishQueued=false;
const S={
 egg:{hits:0,armed:true,opened:false,settled:false,lastHit:0},
 milk:{level:0},
 flour:{level:0},
 mix:{level:0,lastSound:0},
 pour:{level:0,loaded:0,hasBatter:false,lastSound:0},
 cook:{level:0},
 flip:{insert:0,count:0,target:3},
 decor:{selected:null,items:[],honey:0,honeyIntro:0,honeyDone:false,done:false,undos:0,sparkles:[]},
 score:{penalty:0,milkGood:0,milkBad:0},
 tapSeq:{step:0}
};

function resize(){let r=c.getBoundingClientRect();D=Math.min(devicePixelRatio||1,2);W=r.width;H=r.height;c.width=W*D;c.height=H*D;ctx.setTransform(D,0,0,D,0,0)}
addEventListener("resize",resize);resize();
const MASTER_VOL=3.8;
function ensureAudio(){
 if(!audio){
   audio=new(window.AudioContext||window.webkitAudioContext)();
 }
 if(audio.state==="suspended")audio.resume();
 return audio;
}
function beep(f=500,d=.05,v=.015,type="sine"){
 if(!sound)return;
 try{
   const ac=ensureAudio(),o=ac.createOscillator(),g=ac.createGain();
   o.type=type;o.frequency.value=f;o.connect(g);g.connect(ac.destination);
   g.gain.value=Math.min(.12,v*MASTER_VOL);
   g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);
   o.start();o.stop(ac.currentTime+d)
 }catch(e){}
}
function noiseBurst(d=.08,v=.018,filter=900){
 if(!sound)return;
 try{
   const ac=ensureAudio(),len=Math.max(1,Math.floor(ac.sampleRate*d));
   const b=ac.createBuffer(1,len,ac.sampleRate),data=b.getChannelData(0);
   for(let i=0;i<len;i++)data[i]=(Math.random()*2-1)*(1-i/len);
   const src=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();
   src.buffer=b;f.type="lowpass";f.frequency.value=filter;
   g.gain.value=Math.min(.12,v*MASTER_VOL);
   src.connect(f);f.connect(g);g.connect(ac.destination);src.start()
 }catch(e){}
}
function soundTap(){noiseBurst(.045,.018,1200);beep(420,.035,.012,"triangle")}
function soundPour(){noiseBurst(.11,.012,650);beep(145,.07,.008,"sine")}
function soundMix(){noiseBurst(.05,.010,520);beep(105,.04,.008,"triangle")}
function soundScoop(){noiseBurst(.055,.014,800);beep(210,.055,.012,"sine")}
function soundSizzle(){noiseBurst(.09,.012,2200)}
function soundPlop(){noiseBurst(.045,.020,500);beep(125,.085,.022,"sine")}
function soundFlame(){noiseBurst(.045,.005,300)}
function soundCrack(){noiseBurst(.055,.026,1400);beep(185,.045,.018,"square")}

let bgmTimer=null,bgmStep=0;
const BGM_NOTES=[523.25,659.25,783.99,659.25,587.33,698.46,880.00,698.46];
function bgmTick(){
 if(!sound)return;
 try{
   const ac=ensureAudio(),now=ac.currentTime;
   const f=BGM_NOTES[bgmStep%BGM_NOTES.length];
   const notes=[f,f/2];
   notes.forEach((nf,i)=>{
     const o=ac.createOscillator(),g=ac.createGain();
     o.type=i?"triangle":"sine";o.frequency.value=nf;
     o.connect(g);g.connect(ac.destination);
     g.gain.setValueAtTime(.0001,now);
     g.gain.exponentialRampToValueAtTime(i?.020:.050,now+.025);
     g.gain.exponentialRampToValueAtTime(.0001,now+.36);
     o.start(now);o.stop(now+.38)
   });
   bgmStep++;
 }catch(e){}
}
function startBGM(){
 if(bgmTimer||!sound)return;
 // cheerful little start cue so parents can tell BGM is ON
 beep(523,.08,.026,"triangle");
 setTimeout(()=>beep(659,.08,.026,"triangle"),90);
 setTimeout(()=>beep(784,.11,.028,"sine"),180);
 setTimeout(bgmTick,260);
 bgmTimer=setInterval(bgmTick,460);
}
function stopBGM(){
 if(bgmTimer){clearInterval(bgmTimer);bgmTimer=null}
}
function soundComplete(){
 if(!sound)return;
 beep(660,.12,.030,"triangle");
 setTimeout(()=>beep(880,.13,.032,"triangle"),90);
 setTimeout(()=>beep(1100,.18,.035,"sine"),180);
}
function msg(s){toast.textContent=s;toast.classList.add("on");setTimeout(()=>toast.classList.remove("on"),520)}
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
function meter(v){fill.style.width=Math.max(0,Math.min(100,v))+"%"}

function setDots(){dots.textContent=Array.from({length:8},(_,i)=>i===stage?"●":i<stage?"•":"○").join(" ")}
const BX=()=>W*.40,BY=()=>H*.61;

const guideText=[
 "おうちの人へ：たまごをタップ！ ボウルの上へ動いて、パカッと割れます。",
 "おうちの人へ：牛乳をタップするとボウルの上へ。そこで待つので、もう1回タップするとゆっくり注ぎます。",
 "おうちの人へ：ホットケーキミックスをタップするとボウルの上へ。そこで待つので、もう1回タップするとゆっくりサラサラ入ります。",
 "おうちの人へ：泡立て器を3回タップ。タップするたび、ダマが減って生地がなめらかになります。",
 "おうちの人へ：おたまをタップすると生地をすくってその場で待ちます。もう1回でフライパンへ運びます。",
 "おうちの人へ：すぐ焼けるよ！ 少しだけ待ってみよう。",
 "おうちの人へ：パンケーキをタップ！ 3回ひっくり返せます。",
 "おうちの人へ：好きなトッピングを選んで、パンケーキをタップしよう。"
];
function updateGuide(){
 let extra="";

 if(stage===1||stage===2||stage===4)extra="　"+(S.tapSeq.step+1)+"/2";
 if(stage===3)extra="　"+(S.tapSeq.step+1)+"/3";
 if(stage===6)extra="　"+(S.flip.count+1)+"/"+S.flip.target;
 guide.textContent=(guideText[stage]||"")+extra;
 decorControls.style.display=(stage===7&&S.decor.honeyDone&&!S.decor.done)?"flex":"none"
}

function beginTransition(type,duration=1200,advance=true){
 if(locked||transition)return;
 locked=true;drag=null;
 meter(advance?95:Math.min(90,(S.tapSeq.step+1)*30));
 transitionFinishQueued=false;
 transition={type,start:performance.now(),duration,advance};
 if(!advance){soundTap();msg("つぎもタップ！ ✨")}
}
function finishTransition(){
 if(!transition)return;
 const finishedType=transition.type, shouldAdvance=transition.advance!==false;
 transition=null;transitionFinishQueued=false;

 if(finishedType==="flip"){
   S.flip.count++;
   S.flip.insert=0;
   if(S.flip.count<S.flip.target){
     locked=false;stageStart=performance.now();meter(S.flip.count/S.flip.target*100);setDots();updateGuide();
     soundComplete();msg("✨ "+S.flip.count+" / "+S.flip.target);
     return;
   }
 }

 if(!shouldAdvance){
   locked=false;stageStart=performance.now();setDots();updateGuide();
   return;
 }

 if(finishedType==="egg"){S.egg.opened=true;S.egg.settled=true;}
 stage=Math.min(7,stage+1);
 S.tapSeq.step=0;
 soundComplete();msg("できた！ ✨");
 locked=false;stageStart=performance.now();meter(0);setDots();updateGuide();
 if(stage===7){S.decor.honeyIntro=0;S.decor.honey=0;S.decor.honeyDone=false;locked=true;}
}

function bg(){
  // High-quality princess kitchen background layer.
  if(PRINCESS_BG.complete){
    ctx.drawImage(PRINCESS_BG,0,0,W,H);
  }else{
    const g=ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,"#fff3f8");g.addColorStop(.55,"#ffe9f1");g.addColorStop(1,"#e5b07d");
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  }

  // Soft glassy working surface so moving game objects remain easy to read.

function topping(type,x,y,s=1){const fn={strawberry:drawStrawberry,banana:drawBanana,blueberry:drawBlueberry,chocolate:drawChocolate,star:drawStar,cream:drawCream,broccoli:drawBroccoli,fish:drawFish,onion:drawOnion,butter:drawButter,kiwi:drawKiwi,raspberry:drawRaspberry,cookie:drawCookie}[type];if(fn)fn(x,y,s)}
function addSparkle(x,y){
 const now=performance.now();
 for(let i=0;i<9;i++)S.decor.sparkles.push({x,y,a:i*Math.PI/4.5,r:4+Math.random()*12,t:now});
}
function drawSparkles(){
 const now=performance.now();
 S.decor.sparkles=S.decor.sparkles.filter(p=>now-p.t<650);
 for(const p of S.decor.sparkles){
   const age=(now-p.t)/650,dist=8+age*34;
   const x=p.x+Math.cos(p.a)*dist,y=p.y+Math.sin(p.a)*dist;
   ctx.save();ctx.translate(x,y);ctx.rotate(age*Math.PI);
   ctx.globalAlpha=1-age;ctx.fillStyle="#ffd95e";
   ctx.beginPath();for(let i=0;i<8;i++){let a=-Math.PI/2+i*Math.PI/4,r=i%2?2.5:7;let px=Math.cos(a)*r,py=Math.sin(a)*r;i?ctx.lineTo(px,py):ctx.moveTo(px,py)}ctx.closePath();ctx.fill();ctx.restore()
 }
 ctx.globalAlpha=1
}
function syrupBottle(x,y,angle=.12){ctx.save();ctx.translate(x,y);ctx.rotate(angle);ctx.scale(1.2,1.2);ctx.fillStyle="#d8a061";rr(-25,-51,50,94,13);ctx.fillStyle="#875026";rr(-20,-41,40,57,9);ctx.fillStyle="#f2d4a9";rr(-10,-67,20,18,4);ctx.restore()}
function creamBag(x,y){ctx.save();ctx.translate(x,y);ctx.scale(1.15,1.15);ctx.fillStyle="#f5d9ea";ctx.beginPath();ctx.moveTo(-30,-50);ctx.lineTo(30,-50);ctx.lineTo(12,36);ctx.lineTo(-12,36);ctx.closePath();ctx.fill();ctx.fillStyle="#b3a5b7";ctx.beginPath();ctx.moveTo(-7,36);ctx.lineTo(7,36);ctx.lineTo(0,55);ctx.closePath();ctx.fill();ctx.restore()}

function hint(){}

function ease01(x){x=Math.max(0,Math.min(1,x));return x*x*(3-2*x)}
function drawTransition(){
 if(!transition)return false;
 let t=Math.min(1,(performance.now()-transition.start)/transition.duration),
     e=t*t*(3-2*t),bx=BX(),by=BY();
 bg();



 if(transition.type==="milkReady"){
   bowl();
   let q=ease01(t);
   milk(W*.78+(bx+80-W*.78)*q,H*.39+(by-185-H*.39)*q,-.35*q)
 }

 if(transition.type==="flourReady"){
   bowl();
   let q=ease01(t);
   flour(W*.78+(bx+82-W*.78)*q,H*.39+(by-185-H*.39)*q,-.35*q)
 }

 if(transition.type==="mixBurst"){
   bowl();drawMixProgress();
   const a=t*Math.PI*3.2;
   const wx=bx+Math.cos(a)*42,wy=by-90+Math.sin(a)*7;
   whisk(wx,wy,true);
   ctx.strokeStyle="#f7e4a6";ctx.lineWidth=5;ctx.globalAlpha=.55;
   ctx.beginPath();ctx.ellipse(bx,by-34,76+S.tapSeq.step*8,16,0,0,Math.PI*2);ctx.stroke();ctx.globalAlpha=1;
   if(Math.random()<.18)soundMix()
 }

 if(transition.type==="scoopOnly"){
   const bowlX=W*.28,bowlY=H*.55;
   bowlAt(bowlX,bowlY,.82);
   let q=ease01(t);
   let lx=W*.79+(bowlX-W*.79)*q;
   let ly=H*.40+(bowlY-125-H*.40)*q;
   ladle(lx,ly,q>.44);
   if(q>.48)coverLadleCupWithBatter(bowlX,bowlY,.82,"#e3b866");
   if(q>.58&&Math.random()<.12)soundScoop()
 }
 if(transition.type==="egg"){
   bowl();
   const sx=W*.80,sy=H*.39,tx=BX(),ty=BY()-135;

   if(t<.34){
     const p=ease01(t/.34);
     egg(sx+(tx-sx)*p,sy+(ty-sy)*p);
   }else if(t<.48){
     egg(tx,ty);
     ctx.save();
     ctx.strokeStyle="#6f5542";ctx.lineWidth=3;
     ctx.beginPath();
     ctx.moveTo(tx-4,ty-23);ctx.lineTo(tx+6,ty-12);ctx.lineTo(tx-4,ty-2);
     ctx.lineTo(tx+6,ty+9);ctx.lineTo(tx-3,ty+20);
     ctx.stroke();
     ctx.restore();
   }else{
     const p=ease01((t-.48)/.30);
     const fade=1-ease01((t-.78)/.22);

     // shell halves — crescent-like clipped halves, not two whole eggs
     ctx.save();
     ctx.globalAlpha=Math.max(0,fade);
     ctx.fillStyle="#fff0cb";ctx.strokeStyle="#c5ad83";ctx.lineWidth=3;

     ctx.save();
     ctx.translate(tx-8-p*42,ty);
     ctx.rotate(-p*.58);
     ctx.beginPath();
     ctx.moveTo(0,-34);
     ctx.bezierCurveTo(-29,-22,-31,22,0,34);
     ctx.lineTo(0,15);
     ctx.lineTo(-8,8);ctx.lineTo(0,0);ctx.lineTo(-7,-8);ctx.lineTo(0,-15);
     ctx.closePath();ctx.fill();ctx.stroke();
     ctx.restore();

     ctx.save();
     ctx.translate(tx+8+p*42,ty);
     ctx.rotate(p*.58);
     ctx.beginPath();
     ctx.moveTo(0,-34);
     ctx.bezierCurveTo(29,-22,31,22,0,34);
     ctx.lineTo(0,15);
     ctx.lineTo(8,8);ctx.lineTo(0,0);ctx.lineTo(7,-8);ctx.lineTo(0,-15);
     ctx.closePath();ctx.fill();ctx.stroke();
     ctx.restore();
     ctx.restore();

     // contents drop into bowl
     const d=ease01((t-.55)/.38);
     const yy=ty+28+(BY()-ty-58)*d;
     ctx.save();
     ctx.globalAlpha=.72;
     ctx.fillStyle="#fffdf0";
     ctx.beginPath();ctx.ellipse(tx,yy,25,35,0,0,Math.PI*2);ctx.fill();
     ctx.globalAlpha=1;
     ctx.fillStyle="#ffc52f";ctx.beginPath();ctx.arc(tx,yy+2,17,0,Math.PI*2);ctx.fill();
     ctx.restore();
   }
 }

 if(transition.type==="milk"){
   bowl();
   // continue from the "ready" position above the bowl — never jump back to the shelf
   let mx=bx+80;
   let my=by-185;
   let rot=-.35+(-2.05+.35)*ease01(Math.min(1,t/.42));
   milk(mx,my,rot);
   if(t>.30&&t<.90){
     let cs=Math.cos(rot),sn=Math.sin(rot);
     let sx=mx+(-13*cs)-(-69*sn),sy=my+(-13*sn)+(-69*cs);
     ctx.strokeStyle="#f8fdff";ctx.lineWidth=13;ctx.lineCap="round";
     ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(sx,by-18);ctx.stroke();
     if(Math.random()<.12)soundPour()
   }
 }

 if(transition.type==="flour"){
   bowl();
   // continue from the "ready" position above the bowl — never jump back to the shelf
   let fx=bx+82;
   let fy=by-185;
   let rot=-.35+(-2.05+.35)*ease01(Math.min(1,t/.42));
   flour(fx,fy,rot);
   if(t>.30&&t<.90){
     let cs=Math.cos(rot),sn=Math.sin(rot);
     let sx=fx+(-20*cs)-(-72*sn),sy=fy+(-20*sn)+(-72*cs);
     ctx.fillStyle="#fff0d1";
     for(let i=0;i<20;i++){
       ctx.beginPath();
       ctx.arc(sx-12+Math.random()*24,sy+Math.random()*(by-18-sy),2+Math.random()*2,0,Math.PI*2);
       ctx.fill()
     }
   }
 }

 if(transition.type==="mix"){
   bowl();drawMixProgress();
   const a=t*Math.PI*6.2;
   const wx=bx+Math.cos(a)*46,wy=by-90+Math.sin(a)*8;
   whisk(wx,wy,true);
   ctx.strokeStyle="#fff0a4";ctx.lineWidth=6;ctx.globalAlpha=.65;
   ctx.beginPath();ctx.ellipse(bx,by-18,86,20,0,0,Math.PI*2);ctx.stroke();ctx.globalAlpha=1;
   if(Math.random()<.16)soundMix()
 }

 if(transition.type==="pour"){
   const bowlX=W*.28,bowlY=H*.55,panX=W*.57,panY=H*.75;
   bowlAt(bowlX,bowlY,.82);stovePan(panX,panY,true);
   let lx,ly;

   if(t<.20){
     // continue from the exact scooped position, then lift out
     const q=ease01(t/.20);
     lx=bowlX;
     ly=(bowlY-125)+(bowlY-145-(bowlY-125))*q;
     ladle(lx,ly,true);
   }else if(t<.68){
     // carry it clearly ABOVE the pan
     const q=ease01((t-.20)/.48);
     lx=bowlX+(panX-bowlX)*q;
     ly=bowlY-145+(panY-195-(bowlY-145))*q;
     ladle(lx,ly,true);
   }else{
     // stay above pan and tilt only at the end
     const q=ease01((t-.68)/.32);
     lx=panX;ly=panY-195;
     ctx.save();
     ctx.translate(lx,ly);ctx.rotate(-.82*q);ctx.translate(-lx,-ly);
     ladle(lx,ly,true);
     ctx.restore();

     if(q>.18){
       const amount=Math.min(1,(q-.18)/.82);
       ctx.strokeStyle="#edcf87";ctx.lineWidth=15;ctx.lineCap="round";
       ctx.beginPath();ctx.moveTo(lx-10,ly+52);ctx.lineTo(panX,panY-12);ctx.stroke();
       pancakeAt(panX,panY-10,.05,amount)
     }
   }
 }

 if(transition.type==="cook"){
   stovePan(W*.48,H*.70,true);
   pancakeAt(W*.48,H*.69,.25+.65*e,1);
   for(let i=0;i<Math.floor(e*9);i++){
     ctx.fillStyle="#ffe9aa";ctx.beginPath();
     ctx.arc(W*.48-65+(i*17)%130,H*.68+(i%2)*10,4,0,Math.PI*2);ctx.fill()
   }
   if(Math.random()<.08)soundSizzle()
 }

 if(transition.type==="flip"){
   stovePan(W*.48,H*.70,true);
   // flipper is visibly underneath first, then pancake launches
   spatula(W*.48+35*(1-e),H*.72+18*(1-e),Math.PI-.12);
   let lift=Math.sin(t*Math.PI)*165,rot=t*Math.PI*2.4;
   ctx.save();ctx.translate(W*.48,H*.69-lift);ctx.rotate(rot);
   let grad=ctx.createRadialGradient(-20,-10,15,0,0,105);
   grad.addColorStop(0,"#f0c978");grad.addColorStop(1,"#b96f32");
   ctx.fillStyle=grad;ctx.beginPath();ctx.ellipse(0,0,102,36,0,0,Math.PI*2);ctx.fill();ctx.restore()
 }

 if(t>=1&&!transitionFinishQueued){
   transitionFinishQueued=true;setTimeout(finishTransition,70)
 }
 return true
}

function draw(){

 let now=performance.now(),dt=Math.min(35,now-lastFrame);lastFrame=now;
 if(drawTransition()){requestAnimationFrame(draw);return}
 bg();let bx=BX(),by=BY();

 if(stage===0){
  bowl();
  ctx.save();ctx.shadowColor="#0002";ctx.shadowBlur=12;
  egg(W*.80,H*.39);
  ctx.restore()
 }
 if(stage===1){
  bowl();
  const ready=S.tapSeq.step>=1;
  ctx.save();ctx.shadowColor="#0002";ctx.shadowBlur=12;
  milk(ready?BX()+80:W*.78,ready?BY()-185:H*.39,ready?-.35:0);
  ctx.restore()
 }
 if(stage===2){
  bowl();
  const ready=S.tapSeq.step>=1;
  ctx.save();ctx.shadowColor="#0002";ctx.shadowBlur=12;
  flour(ready?BX()+82:W*.78,ready?BY()-185:H*.39,ready?-.35:0);
  ctx.restore()
 }
 if(stage===3){
  bowl();drawMixProgress();
  ctx.save();ctx.shadowColor="#0002";ctx.shadowBlur=12;
  if(S.tapSeq.step>0){
    // wire tip reaches the batter surface, but never pierces the bowl front
    whisk(BX(),BY()-90,true);
  }else{
    whisk(W*.79,H*.40,false);
  }
  ctx.restore()
 }
 if(stage===4){
  const bowlX=W*.28,bowlY=H*.55,panX=W*.57,panY=H*.75;
  bowlAt(bowlX,bowlY,.82);
  stovePan(panX,panY,true);

  if(S.tapSeq.step>0){
    // Cup center sits at the batter surface, not below the bowl front.
    ladle(bowlX,bowlY-125,true);

    // Batter redraw hides the lower portion of the cup -> looks submerged.
    coverLadleCupWithBatter(bowlX,bowlY,.82,"#e3b866");
  }else{
    ladle(W*.79,H*.40,false);
  }
 }
 if(stage===5){
  // Easy mode: short baking time, about 2.2 seconds.
  const panX=W*.48,panY=H*.70;
  stovePan(panX,panY,true);
  S.cook.level=Math.min(100,S.cook.level+dt*.067);
  meter(S.cook.level);pancakeAt(panX,panY-10,S.cook.level/115,1);
  for(let i=0;i<Math.floor(S.cook.level/12);i++){
    ctx.fillStyle="#fff0ad";ctx.beginPath();
    ctx.arc(panX-62+(i*18)%124,panY-18+(i%2)*10,4,0,Math.PI*2);ctx.fill()
  }
  if(Math.random()<.05)soundSizzle();
  if(S.cook.level>=100&&!locked)beginTransition("cook",500)
 }
 if(stage===6){
  const panX=W*.48,panY=H*.70;
  stovePan(panX,panY,true);

  if(drag?.kind==="flipGesture"){
    const lift=Math.max(0,Math.min(100,(drag.startY-drag.fingerY)));
    // Draw the flipper FIRST so the blade is visually underneath the pancake.
    spatula(panX+12,panY+36-lift*.20,Math.PI-0.22+lift*.006);
    pancakeAt(panX,panY-10-lift*.30,.86,1);
  }else{
    if(!drag){
      ctx.globalAlpha=.58+.16*Math.sin(performance.now()/180);
      // blade peeks out from under the right side of the pancake
      spatula(panX+92,panY+38,Math.PI-0.18);
      ctx.globalAlpha=1
    }
    pancakeAt(panX,panY-10,.86,1);
  }

  ctx.fillStyle="#fff8";rr(W*.37,H*.51,W*.22,36,18);
  ctx.fillStyle="#785468";ctx.font="900 18px sans-serif";ctx.textAlign="center";
  ctx.fillText((S.flip.count+1)+" / "+S.flip.target,W*.48,H*.535);
 }
 if(stage===7){
  if(!S.decor.honeyDone){
    S.decor.honeyIntro=Math.min(100,S.decor.honeyIntro+0.55);
    S.decor.honey=S.decor.honeyIntro;
    meter(S.decor.honeyIntro);
    if(S.decor.honeyIntro>=100){S.decor.honeyDone=true;locked=false;stageStart=performance.now();meter(0)}
  }
  const finalMode=S.decor.done;
  const plateCY=finalMode?H*.685:H*.71;
  const plateRY=finalMode?76:100;
  const innerRY=finalMode?64:86;
  // Place the stack toward the front/lower side of the plate.
  // Topping mode used to sit far too high (H*.64).
  const cakeBase=finalMode?H*.725:H*.705;
  const cakeTop=cakeBase-2*33;
  ctx.fillStyle="#bce6fa";ctx.beginPath();ctx.ellipse(W/2,plateCY,W*(finalMode?.47:.49),plateRY,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#fff";ctx.beginPath();ctx.ellipse(W/2,plateCY-6,W*(finalMode?.425:.44),innerRY,0,0,Math.PI*2);ctx.fill();
  for(let k=0;k<3;k++){
    let yy=cakeBase-k*33;
    // photo-inspired toy-like pancake colors:
    // pale yellow body with a warm caramel/orange upper face.
    ctx.fillStyle="#f2df72";
    ctx.beginPath();ctx.ellipse(W/2,yy+7,W*.37,40,0,0,Math.PI*2);ctx.fill();

    let top=ctx.createRadialGradient(W*.44,yy-10,18,W/2,yy,145);
    top.addColorStop(0,"#f3a64a");
    top.addColorStop(.62,"#d9822f");
    top.addColorStop(1,"#b96622");
    ctx.fillStyle=top;
    ctx.beginPath();ctx.ellipse(W/2,yy-5,W*.365,31,0,0,Math.PI*2);ctx.fill();

    ctx.strokeStyle="#f8e98e";ctx.lineWidth=2;ctx.globalAlpha=.55;
    ctx.beginPath();ctx.ellipse(W/2,yy-5,W*.35,27,0,0,Math.PI*2);ctx.stroke();
    ctx.globalAlpha=1;
  }
  if(S.decor.honey>0){
    let h=Math.min(1,S.decor.honey/100);
    ctx.fillStyle="#d99820";ctx.globalAlpha=.18+.64*h;
    ctx.beginPath();ctx.ellipse(W/2,cakeTop-5,W*.29,25,0,0,Math.PI*2);ctx.fill();
    ctx.fillRect(W*.29,cakeTop+5,W*.04,55*h);ctx.fillRect(W*.60,cakeTop+5,W*.035,43*h);ctx.fillRect(W*.48,cakeTop+9,W*.03,35*h);
    ctx.globalAlpha=1
  }

  // smaller palette, more choices
  let types=["strawberry","banana","blueberry","chocolate","cream","butter","kiwi","raspberry","cookie","broccoli","fish","onion"];
  let cols=6;
  if(!S.decor.done)for(let i=0;i<types.length;i++){
    let col=i%cols,row=Math.floor(i/cols),x=W*(.075+col*.17),y=H*(.205+row*.082);
    ctx.fillStyle=S.decor.selected===types[i]?"#fff0a8":"#ffffffdf";ctx.beginPath();ctx.arc(x,y,24,0,Math.PI*2);ctx.fill();
    topping(types[i],x,y,.68)
  }
  S.decor.items.forEach(o=>topping(o.type,o.x,o.y+(S.decor.done?H*.018:0),o.s||.78));
  drawSparkles();
  if(S.decor.done){
    // appetizing finish: toasted edge, butter, glossy syrup and warm highlights
    const topY=cakeTop;
    // butter pat
    ctx.save();ctx.translate(W*.47,topY-10);ctx.rotate(-.08);
    ctx.fillStyle="#fff08a";ctx.shadowColor="#c98d2b66";ctx.shadowBlur=8;ctx.fillRect(-23,-9,46,18);
    ctx.fillStyle="#fff7bd";ctx.fillRect(-19,-7,38,5);ctx.restore();
    // syrup ribbon and gloss
    ctx.strokeStyle="#c96e24";ctx.lineWidth=12;ctx.lineCap="round";ctx.globalAlpha=.72;
    ctx.beginPath();ctx.moveTo(W*.37,topY-2);ctx.bezierCurveTo(W*.44,topY+12,W*.55,topY-16,W*.64,topY+5);ctx.stroke();
    ctx.strokeStyle="#f6b65d";ctx.lineWidth=3;ctx.globalAlpha=.8;
    ctx.beginPath();ctx.moveTo(W*.39,topY-5);ctx.bezierCurveTo(W*.47,topY+5,W*.54,topY-13,W*.62,topY+1);ctx.stroke();
    ctx.globalAlpha=1;
    // warm plate glow
    ctx.strokeStyle="#ffd95e";ctx.lineWidth=5;ctx.globalAlpha=.38+.15*Math.sin(performance.now()/220);
    ctx.beginPath();ctx.ellipse(W/2,plateCY-6,W*.43,innerRY+4,0,0,Math.PI*2);ctx.stroke();ctx.globalAlpha=1
  }

  if(!S.decor.honeyDone){
    let p=S.decor.honeyIntro/100;
    let bx=W*(.72-.18*Math.sin(p*Math.PI*2)), by=H*.39;
    let angle=-2.18 + .12*Math.sin(p*Math.PI*3);
    syrupBottle(bx,by,angle);
    // syrup begins at the ACTUAL bottle nozzle after rotation
    const nozzleLocalY=-79*1.2;
    const sx=bx-(nozzleLocalY*Math.sin(angle));
    const sy=by+(nozzleLocalY*Math.cos(angle));
    const ex=W/2+Math.sin(p*8)*W*.10, ey=H*.555;
    ctx.strokeStyle="#d99820";ctx.lineWidth=10;ctx.lineCap="round";
    ctx.beginPath();ctx.moveTo(sx,sy);
    ctx.bezierCurveTo(sx,sy+72,ex+24,ey-80,ex,ey);ctx.stroke();
    ctx.fillStyle="#d99820";
    ctx.beginPath();ctx.ellipse(ex,ey+10+Math.sin(p*12)*4,7,12,0,0,Math.PI*2);ctx.fill()
  }
 }

 updateGuide();
 hint();
 requestAnimationFrame(draw)
}

function pt(e){let r=c.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
function near(q,x,y,r){return Math.hypot(q.x-x,q.y-y)<r}



c.onpointerdown=e=>{
 if(sound){try{ensureAudio();startBGM()}catch(err){}}
 if(locked||transition)return;
 let q=pt(e);stageStart=performance.now();

 if(EASY_MODE){
   if(stage===0&&near(q,W*.80,H*.39,190)){
     S.tapSeq.step=1;S.egg.hits=1;
     soundTap();beginTransition("egg",1500,true);return
   }

   if(stage===1){
     const tx=S.tapSeq.step?BX()+80:W*.78,ty=S.tapSeq.step?BY()-185:H*.39;
     if(near(q,tx,ty,190)){
       S.tapSeq.step++;
       if(S.tapSeq.step<2)beginTransition("milkReady",1100,false);
       else {S.milk.level=100;beginTransition("milk",1750,true)}
       return
     }
   }

   if(stage===2){
     const tx=S.tapSeq.step?BX()+82:W*.78,ty=S.tapSeq.step?BY()-185:H*.39;
     if(near(q,tx,ty,190)){
       S.tapSeq.step++;
       if(S.tapSeq.step<2)beginTransition("flourReady",1100,false);
       else {S.flour.level=100;beginTransition("flour",1750,true)}
       return
     }
   }

   if(stage===3){
     const tx=S.tapSeq.step?BX():W*.79,ty=S.tapSeq.step?BY()-70:H*.40;
     if(near(q,tx,ty,200)){
       S.tapSeq.step++;
       S.mix.level=Math.min(100,S.tapSeq.step/3*100);
       if(S.tapSeq.step<3)beginTransition("mixBurst",1050,false);
       else beginTransition("mix",1500,true);
       return
     }
   }

   if(stage===4){
     const tx=S.tapSeq.step?W*.28:W*.79,ty=S.tapSeq.step?H*.55-82:H*.40;
     if(near(q,tx,ty,200)){
       S.tapSeq.step++;
       if(S.tapSeq.step<2){
         S.pour.hasBatter=true;beginTransition("scoopOnly",1450,false)
       }else{
         S.pour.loaded=100;S.pour.hasBatter=true;S.pour.level=100;
         beginTransition("pour",2200,true)
       }
       return
     }
   }

   if(stage===6&&near(q,W*.48,H*.69,210)){
     soundPlop();beginTransition("flip",1250,true);return
   }
 }

 if(stage===7&&S.decor.honeyDone&&!S.decor.done){
   let types=["strawberry","banana","blueberry","chocolate","cream","butter","kiwi","raspberry","cookie","broccoli","fish","onion"];
   let hitType=null;
   types.forEach((t,i)=>{let col=i%6,row=Math.floor(i/6),x=W*(.075+col*.17),y=H*(.205+row*.082);if(near(q,x,y,30))hitType=t});
   if(hitType){S.decor.selected=hitType;soundTap();msg("✨")}
   else if(S.decor.selected&&q.y>H*.40&&q.y<H*.80){
     let o={type:S.decor.selected,x:q.x,y:q.y,s:.78};S.decor.items.push(o);addSparkle(q.x,q.y);soundTap();drag={kind:"decor",o}
   }
 }
};

c.onpointermove=e=>{
 if(EASY_MODE)return;
 if(!drag||locked||transition)return;let q=pt(e),bx=BX(),by=BY();
 if(drag.kind!=="flipGesture"){drag.x=q.x+(drag.ox||0);drag.y=q.y+(drag.oy||0)}
 else {drag.fingerX=q.x;drag.fingerY=q.y}

 if(drag.kind==="egg"){
  let tx=bx+105,ty=by-22,bottomY=q.y+52,d=Math.hypot(q.x-tx,bottomY-ty);
  if(d>74)S.egg.armed=true;
  if(d<29&&S.egg.armed&&performance.now()-S.egg.lastHit>430){
   S.egg.armed=false;S.egg.lastHit=performance.now();S.egg.hits++;meter(S.egg.hits*28);soundCrack();
   if(S.egg.hits>=3){S.egg.opened=true;drag=null;beginTransition("egg",1650)}
  }
 }

 if(drag?.kind==="milk"){
  // Pack and stream are physically linked: the stream begins at the drawn spout
  // and always falls VERTICALLY from that x-position.
  const aboveBowl = drag.y < by-5;
  drag.rot = aboveBowl ? -2.05 : 0;
  let cs=Math.cos(drag.rot),sn=Math.sin(drag.rot);
  // local spout point of carton after rotation
  drag.sx=drag.x+(-13*cs)-(-69*sn);
  drag.sy=drag.y+(-13*sn)+(-69*cs);
  drag.ty=by-12;
  const landsInBowl = aboveBowl && drag.sx>bx-112 && drag.sx<bx+112 && drag.sy<by-45;
  drag.pouring=aboveBowl;
  if(landsInBowl){
    S.score.milkGood++;
    if(Math.random()<.18)soundPour();
    S.milk.level=Math.min(100,S.milk.level+.28);meter(S.milk.level);
    if(S.milk.level>=100)beginTransition("milk",1300)
  }else if(aboveBowl&&drag.pouring){
    S.score.milkBad++;
    if(S.score.milkBad%28===0)S.score.penalty+=1
  }
 }

 if(drag?.kind==="flour"){
  const overBowl=drag.y<by-5;
  drag.rot=overBowl?-2.05:0;
  let cs=Math.cos(drag.rot),sn=Math.sin(drag.rot);
  // opening local point (-20,-72) after rotation/scale approximation
  drag.sx=drag.x+(-20*cs)-(-72*sn);
  drag.sy=drag.y+(-20*sn)+(-72*cs);
  drag.ty=by-18;
  const landsInBowl=overBowl&&drag.sx>bx-115&&drag.sx<bx+115&&drag.sy<by-40;
  drag.pouring=landsInBowl;
  if(landsInBowl){
    if(Math.random()<.20){noiseBurst(.05,.012,900);beep(145,.03,.010,"triangle")}
    S.flour.level=Math.min(100,S.flour.level+.34);meter(S.flour.level);
    if(S.flour.level>=100)beginTransition("flour",1350)
  }
 }

 if(drag?.kind==="whisk"){
  let dx=drag.x-bx,dy=drag.y-by,inside=Math.abs(dx)<125&&dy>-150&&dy<15;
  if(inside){
    let a=Math.atan2(dy,dx);
    if(drag.a!==null){let d=Math.abs(a-drag.a);if(d>Math.PI)d=2*Math.PI-d;if(d<1.20)drag.total+=d}
    drag.a=a;S.mix.level=Math.min(100,drag.total*2.15);meter(S.mix.level);
    if(performance.now()-S.mix.lastSound>90){S.mix.lastSound=performance.now();soundMix()}
    if(S.mix.level>=100)beginTransition("mix",1650)
  }else drag.a=null
 }

 if(drag?.kind==="ladle"){
  const bowlX=W*.28,bowlY=H*.55,panX=W*.57,panY=H*.75;
  const ladleCup={x:drag.x,y:drag.y+46};
  const bowlHit=near(ladleCup,bowlX,bowlY-5,118);
  const panHit=near(ladleCup,panX,panY-45,170);
  if(bowlHit&&!S.pour.hasBatter){
    S.pour.loaded=Math.min(100,S.pour.loaded+2.4);
    meter(Math.min(45,S.pour.loaded*.45));
    if(performance.now()-S.pour.lastSound>140){S.pour.lastSound=performance.now();soundScoop()}
    if(S.pour.loaded>=100){S.pour.hasBatter=true;msg("✨");soundPlop()}
  }
  if(S.pour.hasBatter&&panHit){
    S.pour.level=Math.min(100,S.pour.level+1.2);meter(45+S.pour.level*.55);
    if(performance.now()-S.pour.lastSound>110){S.pour.lastSound=performance.now();soundPour()}
    if(S.pour.level>=100)beginTransition("pour",1500)
  }
 }

 if(drag?.kind==="flipGesture"){
   const dy=drag.startY-q.y;
   meter(Math.min(85,Math.max(0,dy)*.55));
   if(dy>115&&!drag.launched){
     drag.launched=true;
     drag=null;
     soundPlop();
     beginTransition("flip",1450)
   }
 }

 if(drag?.kind==="decor"){drag.o.x=q.x;drag.o.y=q.y}
};

c.onpointerup=e=>{
 if(!drag)return;let q=pt(e);
 if(drag.kind==="decor"){if(!(q.y>H*.43&&q.y<H*.80))S.decor.items.pop()}
 drag=null;stageStart=performance.now()
};


document.querySelector("#undoBtn").onclick=()=>{
 if(stage!==7||S.decor.done)return;
 if(S.decor.items.length){S.decor.items.pop();S.decor.undos++;S.score.penalty+=2;beep(420,.04);msg("↶")}
};
document.querySelector("#finishBtn").onclick=()=>{
 if(stage!==7||!S.decor.honeyDone||S.decor.done)return;
 S.decor.done=true;drag=null;decorControls.style.display="none";meter(100);soundComplete();
 let variety=new Set(S.decor.items.map(o=>o.type)).size;
 // 100点固定にならないよう、操作ミス・やり直し・盛り付けの種類を評価に反映
 let score=Math.max(55,Math.min(100,94-S.score.penalty-Math.max(0,4-variety)*3+Math.min(6,variety)));
 let rank=score>=95?5:score>=88?4:score>=80?3:score>=70?2:1;
 const gear=["👗","👗 👠","👗 👠 📿","👗 👠 📿 👑","👗 👠 📿 👑 🪄"];
 const names=["かわいいドレス","プリンセスシューズ","きらきらネックレス","ロイヤルティアラ","まほうのステッキ"];
 princessAvatar.textContent=rank>=4?"👸":"👧";
 accessories.textContent=gear[rank-1];
 sparkles.style.display=rank>=4?"block":"none";
 resultTitle.textContent=rank===5?"ロイヤル・プリンセス！":rank>=4?"プリンセス・シェフ！":rank>=3?"すてきなプリンセス！":"プリンセスにちかづいた！";
 resultText.textContent="♛ "+score+"てん　おりょうりできたよ！";
 unlockText.textContent="GET！ "+names.slice(0,rank).join("・");
 finalCard.classList.add("show");photoLabel.style.display="block";guide.style.display="none";document.querySelector("#meter").style.display="none";
};
document.querySelector("#againBtn").onclick=()=>location.reload();

document.addEventListener("pointerdown",()=>{if(sound){try{ensureAudio();startBGM()}catch(e){}}},{once:true});
document.querySelector("#snd").onclick=e=>{
 sound=!sound;e.currentTarget.textContent=sound?"♪":"×";
 if(sound){try{ensureAudio();startBGM()}catch(err){};beep(700,.08,.025,"triangle")}
 else stopBGM();
};
document.querySelector("#home").onclick=()=>location.reload();
setDots();updateGuide();requestAnimationFrame(draw);
</script>
</body>
