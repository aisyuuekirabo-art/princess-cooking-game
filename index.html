<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#fff4f8">
<title>Princess Cooking Studio - Pancake Guided Flow v14</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#fff4f8;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif}
#app{height:100dvh;display:flex;flex-direction:column}
header{height:calc(52px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 8px 4px;display:grid;grid-template-columns:42px 1fr 42px;align-items:center;background:#fff9fc;z-index:10}
header button{height:38px;border:0;border-radius:12px;background:#fff;box-shadow:0 2px 8px #0001;color:#77566a;font-size:19px;font-weight:900}
#dots{text-align:center;font-size:14px;letter-spacing:4px;color:#d8b7c7}
#game{flex:1;min-height:0;position:relative}
canvas{width:100%;height:100%;display:block;touch-action:none}
#meter{position:absolute;left:10%;right:10%;top:10px;height:10px;border-radius:20px;background:#ffffffad;overflow:hidden;box-shadow:0 2px 8px #0001;z-index:4}
#fill{height:100%;width:0;background:linear-gradient(90deg,#ffd34e,#ff70a9);transition:.08s}
#toast{position:absolute;left:50%;top:36px;transform:translateX(-50%);background:#fff;border-radius:30px;padding:7px 15px;font-weight:900;color:#704b5d;box-shadow:0 4px 14px #0002;opacity:0;transition:.18s;white-space:nowrap;z-index:5}
#toast.on{opacity:1}
#guide{position:absolute;left:50%;top:31px;transform:translateX(-50%);width:min(88%,620px);padding:7px 12px;border-radius:14px;background:#fffdf4e8;color:#6d5360;font-size:12px;font-weight:800;text-align:center;box-shadow:0 2px 10px #0001;z-index:4;pointer-events:none}
#decorControls{display:none;position:absolute;right:12px;bottom:14px;gap:8px;z-index:8}
#decorControls button{border:0;border-radius:16px;padding:11px 14px;font-weight:900;font-size:14px;box-shadow:0 3px 10px #0002}
#undoBtn{background:#fff;color:#795a69}
#finishBtn{background:#ff78aa;color:#fff}
#finalCard{display:none;position:absolute;inset:16% 8% 12%;z-index:12;background:#fffdfbeF;border-radius:28px;box-shadow:0 12px 40px #0003;text-align:center;padding:24px}
#finalCard .princessStage{position:relative;min-height:160px;display:flex;align-items:center;justify-content:center;background:linear-gradient(#fff8fd,#fff3cf);border-radius:22px;overflow:hidden;margin-bottom:8px}
#finalCard .princess{font-size:96px;line-height:1.05;filter:drop-shadow(0 5px 8px #0002);animation:royalPop .65s ease-out}
#finalCard .accessories{position:absolute;left:8px;right:8px;bottom:7px;font-size:30px;letter-spacing:7px;animation:royalPop .8s .2s both}
#finalCard .sparkles{position:absolute;inset:10px;font-size:27px;color:#e2ae2f;letter-spacing:16px;animation:twinkle .8s infinite alternate}
#unlockText{margin-top:8px;color:#c17496!important}
@keyframes royalPop{from{opacity:0;transform:scale(.45) translateY(25px)}to{opacity:1;transform:scale(1) translateY(0)}}
@keyframes twinkle{from{opacity:.35;transform:scale(.92)}to{opacity:1;transform:scale(1.08)}}
#finalCard .big{font-size:28px;font-weight:1000;color:#7e526c;margin:8px 0}
#finalCard .small{font-size:15px;font-weight:800;color:#8d7180}
#finalCard button{margin-top:18px;border:0;border-radius:18px;background:#ff78aa;color:#fff;font-weight:900;font-size:16px;padding:12px 20px}
</style>
</head>
<body>
<div id="app">
<header><button id="home">←</button><div id="dots">● ○ ○ ○ ○ ○ ○ ○</div><button id="snd">♪</button></header>
<div id="game">
<div id="meter"><div id="fill"></div></div>
<div id="guide"></div>
<canvas id="c"></canvas><div id="toast"></div>
<div id="decorControls"><button id="undoBtn">↶ 1こもどす</button><button id="finishBtn">できあがり ✓</button></div>
<div id="finalCard"><div class="princessStage"><div class="sparkles" id="sparkles">✦ ✧ ✦</div><div class="princess" id="princessAvatar">👸</div><div class="accessories" id="accessories"></div></div><div class="big" id="resultTitle">プリンセス・クッキング！</div><div class="small" id="resultText">すてきに もりつけできました ✨</div><div class="small" id="unlockText"></div><button id="againBtn">もういちど</button></div>
</div>
</div>

<script>
const c=document.querySelector("#c"),ctx=c.getContext("2d");
const fill=document.querySelector("#fill"),dots=document.querySelector("#dots"),toast=document.querySelector("#toast"),guide=document.querySelector("#guide"),decorControls=document.querySelector("#decorControls"),finalCard=document.querySelector("#finalCard"),resultTitle=document.querySelector("#resultTitle"),resultText=document.querySelector("#resultText"),princessAvatar=document.querySelector("#princessAvatar"),accessories=document.querySelector("#accessories"),unlockText=document.querySelector("#unlockText"),sparkles=document.querySelector("#sparkles");
let W=0,H=0,D=1,sound=true,audio=null,stage=0,drag=null,locked=false,stageStart=performance.now();
let transition=null,lastFrame=performance.now(),transitionFinishQueued=false;
const S={
 egg:{hits:0,armed:true,opened:false,settled:false,lastHit:0},
 milk:{level:0},
 flour:{level:0},
 mix:{level:0,lastSound:0},
 pour:{level:0,loaded:0,hasBatter:false,lastSound:0},
 cook:{level:0},
 flip:{insert:0},
 decor:{selected:null,items:[],honey:0,honeyIntro:0,honeyDone:false,done:false,undos:0}, score:{penalty:0,milkGood:0,milkBad:0}
};

function resize(){let r=c.getBoundingClientRect();D=Math.min(devicePixelRatio||1,2);W=r.width;H=r.height;c.width=W*D;c.height=H*D;ctx.setTransform(D,0,0,D,0,0)}
addEventListener("resize",resize);resize();
function beep(f=500,d=.05,v=.015,type="sine"){if(!sound)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();audio.resume();let o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.value=f;o.connect(g);g.connect(audio.destination);g.gain.value=v;g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.start();o.stop(audio.currentTime+d)}catch(e){}}
function soundTap(){beep(540,.035,.012,"triangle")}
function soundPour(){beep(190,.045,.010,"sine")}
function soundMix(){beep(118,.035,.010,"triangle")}
function soundScoop(){beep(235,.05,.012,"sine")}
function soundSizzle(){beep(92,.035,.006,"sawtooth")}
function soundPlop(){beep(165,.07,.018,"sine")}
function soundFlame(){beep(72,.035,.004,"sine")}
function msg(s){toast.textContent=s;toast.classList.add("on");setTimeout(()=>toast.classList.remove("on"),520)}
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
function meter(v){fill.style.width=Math.max(0,Math.min(100,v))+"%"}
function setDots(){dots.textContent=Array.from({length:8},(_,i)=>i===stage?"●":i<stage?"•":"○").join(" ")}
const BX=()=>W*.40,BY=()=>H*.61;

const guideText=[
 "おうちの人へ：卵をつかんで、ボウルのふちの丸へ3回コンコン。",
 "おうちの人へ：牛乳パックを持ってボウルの上へ。注ぎ口から真下に牛乳が落ちます。",
 "おうちの人へ：粉の袋をボウルの上へ持っていき、入れてあげよう。",
 "おうちの人へ：右の泡立て器をつかみ、先をボウルの生地に入れてから、指でぐるぐる混ぜよう。",
 "おうちの人へ：おたまを左のボウルにしっかり入れて生地をすくい、火のついたコンロのフライパンへ運んで流そう。",
 "おうちの人へ：焼ける色と気泡の変化を見ながら少し待とう。",
 "おうちの人へ：フライ返しをパンケーキの下へ入れて、上へ持ち上げよう。",
 "おうちの人へ：材料を選んでパンケーキをタップ。間違えたら『1こもどす』。終わったら『できあがり』。"
];
function updateGuide(){guide.textContent=guideText[stage]||"";decorControls.style.display=(stage===7&&S.decor.honeyDone&&!S.decor.done)?"flex":"none"}

function beginTransition(type,duration=1200){
 if(locked||transition)return;
 locked=true;drag=null;meter(100);transitionFinishQueued=false;
 transition={type,start:performance.now(),duration};beep(880,.08);
}
function finishTransition(){
 if(!transition)return;
 const finishedType=transition.type;
 transition=null;transitionFinishQueued=false;
 if(finishedType==="egg")S.egg.settled=true;
 stage=Math.min(7,stage+1);
 locked=false;stageStart=performance.now();meter(0);setDots();updateGuide();
 if(stage===7){S.decor.honeyIntro=0;S.decor.honey=0;S.decor.honeyDone=false;locked=true;}
}

function bg(){
 let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,"#f7eafa");g.addColorStop(.58,"#fff8ef");g.addColorStop(.581,"#d7a57d");g.addColorStop(1,"#b9784f");ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 // backsplash
 ctx.fillStyle="#fff4fa";ctx.fillRect(0,0,W,H*.58);
 ctx.strokeStyle="#ead7e4";ctx.lineWidth=1;
 for(let y=0;y<H*.58;y+=38){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
 for(let y=0;y<H*.58;y+=38)for(let x=((y/38)%2)*38-38;x<W;x+=76){ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x,y+38);ctx.stroke()}
 // window + curtains
 ctx.fillStyle="#dff5ff";ctx.beginPath();ctx.arc(W*.17,H*.22,56,Math.PI,0);ctx.lineTo(W*.17+56,H*.40);ctx.lineTo(W*.17-56,H*.40);ctx.closePath();ctx.fill();
 ctx.strokeStyle="#fff";ctx.lineWidth=7;ctx.stroke();
 ctx.fillStyle="#f6c8dd";ctx.fillRect(W*.075,H*.17,12,H*.23);ctx.fillRect(W*.255,H*.17,12,H*.23);
 // upper cabinets
 ctx.fillStyle="#f7cfe0";rr(W*.61,H*.145,W*.30,H*.18,18);
 ctx.fillStyle="#fff7fb";rr(W*.635,H*.17,W*.11,H*.125,12);rr(W*.77,H*.17,W*.11,H*.125,12);
 ctx.fillStyle="#d4aa43";ctx.beginPath();ctx.arc(W*.75,H*.235,4,0,7);ctx.fill();ctx.beginPath();ctx.arc(W*.765,H*.235,4,0,7);ctx.fill();
 ctx.font="26px serif";ctx.textAlign="center";ctx.fillText("♛",W*.755,H*.13);
 // shelf with jars
 ctx.fillStyle="#b77c58";ctx.fillRect(W*.34,H*.235,W*.22,7);
 for(let i=0;i<3;i++){let x=W*(.37+i*.075);ctx.fillStyle=["#f4d37c","#ef9c9c","#a9d5a4"][i];rr(x,H*.19,24,38,7);ctx.fillStyle="#7f5b4b";ctx.fillRect(x,H*.185,24,5)}
 // hanging utensils
 ctx.strokeStyle="#b58aa1";ctx.lineWidth=4;
 for(let i=0;i<3;i++){let x=W*(.39+i*.055);ctx.beginPath();ctx.moveTo(x,H*.285);ctx.lineTo(x,H*.385);ctx.stroke();ctx.fillStyle="#d9b7c7";ctx.beginPath();ctx.arc(x,H*.395,10,0,7);ctx.fill()}
 // sink + faucet
 ctx.fillStyle="#d9edf4";rr(W*.05,H*.48,W*.22,H*.055,14);
 ctx.strokeStyle="#8aa4ad";ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(W*.15,H*.48);ctx.quadraticCurveTo(W*.15,H*.43,W*.205,H*.445);ctx.stroke();
 // stove/oven area at right
 ctx.fillStyle="#f5e9ee";rr(W*.68,H*.43,W*.24,H*.115,14);
 ctx.fillStyle="#40454b";for(let i=0;i<2;i++){ctx.beginPath();ctx.ellipse(W*(.735+i*.11),H*.455,25,9,0,0,7);ctx.fill()}
 ctx.fillStyle="#ead5de";rr(W*.70,H*.60,W*.20,H*.22,16);
 ctx.fillStyle="#4d5158";rr(W*.72,H*.64,W*.16,H*.115,10);
 ctx.strokeStyle="#d6b5c4";ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(W*.75,H*.62);ctx.lineTo(W*.85,H*.62);ctx.stroke();
 // counter
 ctx.fillStyle="#fffdf8";ctx.fillRect(0,H*.54,W,H*.055);ctx.fillStyle="#d8a77c";ctx.fillRect(0,H*.595,W,H*.405);
 ctx.fillStyle="#c18a60";ctx.fillRect(0,H*.61,W,7);
 // lower cabinet panels
 ctx.strokeStyle="#aa734f";ctx.lineWidth=2;for(let x=18;x<W;x+=105)ctx.strokeRect(x,H*.78,88,H*.17);
}
function bowl(){
 let x=BX(),y=BY();
 let level=Math.min(1,(S.egg.opened?0.16:0)+S.milk.level/210+S.flour.level/230+S.mix.level/160);
 ctx.fillStyle="#bfe7f9";ctx.beginPath();ctx.moveTo(x-136,y-14);ctx.quadraticCurveTo(x-108,y+150,x,y+155);ctx.quadraticCurveTo(x+108,y+150,x+136,y-14);ctx.fill();
 ctx.fillStyle="#fff";ctx.beginPath();ctx.ellipse(x,y-14,136,35,0,0,Math.PI*2);ctx.fill();
 if(level>0){ctx.fillStyle=`rgb(${246-Math.floor(level*25)},${225-Math.floor(level*18)},${166-Math.floor(level*22)})`;ctx.beginPath();ctx.ellipse(x,y-10,116,26+level*8,0,0,Math.PI*2);ctx.fill()}
 if(S.egg.settled&&stage<=3){ctx.fillStyle="#ffc62e";ctx.beginPath();ctx.arc(x-20,y-11,18,0,Math.PI*2);ctx.fill()}
 if(stage===2&&S.flour.level>5){ctx.fillStyle="#f8e8c8";ctx.beginPath();ctx.ellipse(x+24,y-17,54,17,0,0,Math.PI*2);ctx.fill()}
 if(stage===3&&S.mix.level>5){ctx.strokeStyle="#fff2b7";ctx.lineWidth=6;ctx.beginPath();ctx.ellipse(x,y-8,78,16,0,0,Math.PI*2);ctx.stroke()}
}
function bowlAt(x,y,scale=1){
 ctx.save();ctx.translate(x-BX(),y-BY());ctx.scale(scale,scale);bowl();ctx.restore()
}
function stovePan(cx,cy,flame=true){
 // compact cooktop under the pan
 ctx.save();
 ctx.fillStyle="#f1e7e4";rr(cx-148,cy+32,296,72,20);
 ctx.fillStyle="#33383e";ctx.beginPath();ctx.ellipse(cx,cy+43,112,24,0,0,Math.PI*2);ctx.fill();
 if(flame){
   for(let i=-2;i<=2;i++){
     let fx=cx+i*30,fy=cy+58;
     ctx.fillStyle=i%2?"#ff9d2e":"#4aa7ff";
     ctx.beginPath();ctx.moveTo(fx,fy+18);ctx.quadraticCurveTo(fx-14,fy,fx,fy-20);ctx.quadraticCurveTo(fx+14,fy,fx,fy+18);ctx.fill()
   }
 }
 ctx.fillStyle="#292c31";ctx.beginPath();ctx.ellipse(cx,cy,138,50,0,0,Math.PI*2);ctx.fill();
 ctx.fillStyle="#292c31";rr(cx+105,cy-11,165,22,11);
 ctx.restore()
}
function pancakeAt(cx,cy,b=.3,scale=1){
 ctx.save();ctx.translate(cx,cy);ctx.scale(scale,scale);
 let grad=ctx.createRadialGradient(-20,-10,15,0,0,105);
 grad.addColorStop(0,`rgb(${246-b*38},${218-b*32},${151-b*20})`);
 grad.addColorStop(1,`rgb(${221-b*45},${171-b*38},${93-b*18})`);
 ctx.fillStyle=grad;ctx.beginPath();ctx.ellipse(0,0,102,36,0,0,Math.PI*2);ctx.fill();
 ctx.fillStyle="#c88943";ctx.globalAlpha=.12+b*.35;
 for(let i=0;i<8;i++){ctx.beginPath();ctx.arc(-70+i*20,-5+(i%2)*12,4+(i%3),0,Math.PI*2);ctx.fill()}
 ctx.globalAlpha=1;ctx.restore()
}

function pulse(x,y,r=27){ctx.strokeStyle="#ff5f9c";ctx.lineWidth=6;ctx.globalAlpha=.65+.2*Math.sin(performance.now()/160);ctx.beginPath();ctx.arc(x,y,r+3*Math.sin(performance.now()/180),0,Math.PI*2);ctx.stroke();ctx.globalAlpha=1}
function toolGlow(x,y,r=82){ctx.fillStyle="#ffffffbe";ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();ctx.strokeStyle="#ff9bc0";ctx.lineWidth=4;ctx.globalAlpha=.45+.2*Math.sin(performance.now()/180);ctx.stroke();ctx.globalAlpha=1}
function arrow(x1,y1,x2,y2){ctx.save();ctx.strokeStyle="#ff6fa8";ctx.lineWidth=7;ctx.lineCap="round";ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();let a=Math.atan2(y2-y1,x2-x1);ctx.fillStyle="#ff6fa8";ctx.beginPath();ctx.moveTo(x2,y2);ctx.lineTo(x2-18*Math.cos(a-.5),y2-18*Math.sin(a-.5));ctx.lineTo(x2-18*Math.cos(a+.5),y2-18*Math.sin(a+.5));ctx.closePath();ctx.fill();ctx.restore()}
function egg(x,y){
 ctx.save();ctx.translate(x,y);ctx.scale(1.35,1.35);
 if(S.egg.opened){
  ctx.fillStyle="#fff4dc";ctx.strokeStyle="#bfa984";ctx.lineWidth=3;
  ctx.beginPath();ctx.ellipse(-22,0,18,31,-.3,0,Math.PI*2);ctx.fill();ctx.stroke();
  ctx.beginPath();ctx.ellipse(22,0,18,31,.3,0,Math.PI*2);ctx.fill();ctx.stroke();
 }else{
  ctx.fillStyle="#fff4dc";ctx.beginPath();ctx.ellipse(0,0,28,38,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle="#c8b493";ctx.lineWidth=2;ctx.stroke();
  ctx.strokeStyle="#6d5848";ctx.lineWidth=2.4;
  if(S.egg.hits>=1){ctx.beginPath();ctx.moveTo(-5,-27);ctx.lineTo(4,-16);ctx.lineTo(-4,-6);ctx.stroke()}
  if(S.egg.hits>=2){ctx.beginPath();ctx.moveTo(4,-16);ctx.lineTo(13,-7);ctx.lineTo(5,3);ctx.stroke();ctx.beginPath();ctx.moveTo(-4,-6);ctx.lineTo(-13,3);ctx.stroke()}
 }
 ctx.restore()
}
function milk(x,y,r){
 ctx.save();ctx.translate(x,y);ctx.rotate(r);ctx.scale(1.34,1.34);
 ctx.fillStyle="#e8f8ff";rr(-34,-52,68,104,10);ctx.strokeStyle="#7dbbd9";ctx.lineWidth=3;ctx.strokeRect(-34,-52,68,104);
 ctx.fillStyle="#76cef3";ctx.fillRect(-31,-5,62,39);ctx.fillStyle="#fff";ctx.font="bold 14px sans-serif";ctx.textAlign="center";ctx.fillText("MILK",0,19);
 ctx.fillStyle="#d3edf8";ctx.beginPath();ctx.moveTo(-30,-52);ctx.lineTo(-13,-69);ctx.lineTo(5,-52);ctx.closePath();ctx.fill();ctx.restore()
}
function flour(x,y){
 ctx.save();ctx.translate(x,y);ctx.scale(1.34,1.34);ctx.fillStyle="#e7c793";rr(-40,-55,80,110,13);ctx.fillStyle="#fff5da";rr(-25,-18,50,44,9);ctx.fillStyle="#9a7041";ctx.font="bold 17px sans-serif";ctx.textAlign="center";ctx.fillText("こな",0,10);ctx.restore()
}
function whisk(x,y,inserted=false){
 ctx.save();ctx.translate(x,y);ctx.scale(1.30,1.30);
 ctx.fillStyle="#ee83ad";rr(-9,-70,18,74,9);
 ctx.strokeStyle="#7e939e";ctx.lineWidth=3;
 let bottom=inserted?56:67;
 for(let i=-2;i<=2;i++){
   ctx.beginPath();ctx.moveTo(i*3,2);
   ctx.quadraticCurveTo(i*13,34,0,bottom);ctx.stroke()
 }
 ctx.restore()
}
function ladle(x,y,filled=false){
 ctx.save();ctx.translate(x,y);ctx.scale(1.35,1.35);
 ctx.strokeStyle="#7f624f";ctx.lineWidth=10;ctx.lineCap="round";
 ctx.beginPath();ctx.moveTo(0,-82);ctx.lineTo(0,-5);ctx.stroke();
 ctx.fillStyle="#b9c3ca";ctx.strokeStyle="#7f8d95";ctx.lineWidth=3;
 ctx.beginPath();ctx.arc(0,25,34,0,Math.PI*2);ctx.fill();ctx.stroke();
 ctx.fillStyle=filled?"#edd39a":"#dfe6ea";ctx.beginPath();ctx.ellipse(0,25,27,12,0,0,Math.PI*2);ctx.fill();
 ctx.restore()
}
function spatula(x,y,r=0){
 ctx.save();ctx.translate(x,y);ctx.rotate(r);ctx.scale(1.3,1.3);ctx.fillStyle="#b9c5cc";rr(-33,8,66,44,10);ctx.strokeStyle="#7d909a";ctx.lineWidth=3;ctx.strokeRect(-30,12,60,36);ctx.fillStyle="#995e45";rr(-9,-82,18,93,8);ctx.restore()
}
function pan(){ctx.fillStyle="#292c31";ctx.beginPath();ctx.ellipse(W*.42,H*.69,138,50,0,0,Math.PI*2);ctx.fill();ctx.fillStyle="#292c31";rr(W*.63,H*.675,150,22,11)}
function pancake(y=H*.67,b=.3,scale=1){
 ctx.save();ctx.translate(W*.42,y);ctx.scale(scale,scale);
 let grad=ctx.createRadialGradient(-20,-10,15,0,0,105);grad.addColorStop(0,`rgb(${246-b*38},${218-b*32},${151-b*20})`);grad.addColorStop(1,`rgb(${221-b*45},${171-b*38},${93-b*18})`);
 ctx.fillStyle=grad;ctx.beginPath();ctx.ellipse(0,0,102,36,0,0,Math.PI*2);ctx.fill();
 ctx.fillStyle="#c88943";ctx.globalAlpha=.12+b*.35;for(let i=0;i<8;i++){ctx.beginPath();ctx.arc(-70+i*20,-5+(i%2)*12,4+(i%3),0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;ctx.restore()
}
function drawStrawberry(x,y,s=1){ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.fillStyle="#e94b5a";ctx.beginPath();ctx.moveTo(0,27);ctx.bezierCurveTo(-30,-2,-24,-25,0,-21);ctx.bezierCurveTo(24,-25,30,-2,0,27);ctx.fill();ctx.fillStyle="#54a34e";ctx.beginPath();ctx.moveTo(-15,-19);ctx.lineTo(0,-10);ctx.lineTo(15,-19);ctx.lineTo(7,-5);ctx.lineTo(-7,-5);ctx.fill();ctx.restore()}
function drawBanana(x,y,s=1){ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.fillStyle="#ffd34b";ctx.beginPath();ctx.arc(0,0,27,.45,Math.PI*1.55);ctx.arc(0,0,13,Math.PI*1.55,.45,true);ctx.closePath();ctx.fill();ctx.restore()}
function drawBlueberry(x,y,s=1){ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.fillStyle="#566bc1";ctx.beginPath();ctx.arc(0,0,18,0,Math.PI*2);ctx.fill();ctx.fillStyle="#8795da";ctx.beginPath();ctx.arc(-5,-6,5,0,Math.PI*2);ctx.fill();ctx.restore()}
function drawChocolate(x,y,s=1){ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.fillStyle="#70422f";rr(-22,-18,44,36,5);ctx.strokeStyle="#9f684c";ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,-18);ctx.lineTo(0,18);ctx.moveTo(-22,0);ctx.lineTo(22,0);ctx.stroke();ctx.restore()}

function drawBroccoli(x,y,s=1){ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.fillStyle="#6ba54c";rr(-6,-2,12,30,5);ctx.fillStyle="#4a913c";for(const [a,b,r] of [[-13,-10,13],[0,-16,15],[14,-9,13],[-2,-3,12]]){ctx.beginPath();ctx.arc(a,b,r,0,Math.PI*2);ctx.fill()}ctx.restore()}
function drawFish(x,y,s=1){ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.fillStyle="#7bbbd4";ctx.beginPath();ctx.moveTo(-26,0);ctx.quadraticCurveTo(0,-22,28,0);ctx.quadraticCurveTo(0,22,-26,0);ctx.fill();ctx.beginPath();ctx.moveTo(-25,0);ctx.lineTo(-42,-18);ctx.lineTo(-42,18);ctx.closePath();ctx.fill();ctx.fillStyle="#222";ctx.beginPath();ctx.arc(17,-4,2.5,0,Math.PI*2);ctx.fill();ctx.restore()}

function drawButter(x,y,s=1){ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.fillStyle="#ffd85f";rr(-24,-15,48,30,6);ctx.fillStyle="#fff0a4";ctx.fillRect(-18,-11,36,7);ctx.restore()}
function drawKiwi(x,y,s=1){ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.fillStyle="#8bcf58";ctx.beginPath();ctx.arc(0,0,22,0,Math.PI*2);ctx.fill();ctx.fillStyle="#f4f0cf";ctx.beginPath();ctx.arc(0,0,7,0,Math.PI*2);ctx.fill();ctx.fillStyle="#493a2f";for(let i=0;i<10;i++){let a=i*Math.PI/5;ctx.beginPath();ctx.arc(Math.cos(a)*14,Math.sin(a)*14,1.7,0,Math.PI*2);ctx.fill()}ctx.restore()}
function drawRaspberry(x,y,s=1){ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.fillStyle="#df3f72";for(let j=-1;j<=1;j++)for(let i=-1;i<=1;i++){ctx.beginPath();ctx.arc(i*8+(j%2)*3,j*8,7,0,Math.PI*2);ctx.fill()}ctx.fillStyle="#5ca64e";ctx.beginPath();ctx.moveTo(-10,-16);ctx.lineTo(0,-8);ctx.lineTo(10,-16);ctx.closePath();ctx.fill();ctx.restore()}

function syrupBottle(x,y,angle=.12){ctx.save();ctx.translate(x,y);ctx.rotate(angle);ctx.scale(1.2,1.2);ctx.fillStyle="#d8a061";rr(-25,-51,50,94,13);ctx.fillStyle="#875026";rr(-20,-41,40,57,9);ctx.fillStyle="#f2d4a9";rr(-10,-67,20,18,4);ctx.restore()}

function hint(){
 if(drag||locked||performance.now()-stageStart<1100)return;
 if(stage===0){pulse(BX()+105,BY()-22,25);arrow(W*.79,H*.31,BX()+120,BY()-55)}
 if(stage===1){arrow(W*.80,H*.25,BX()+75,BY()-105)}
 if(stage===2){arrow(W*.79,H*.27,BX()+120,BY()-130)}
 if(stage===3){
 ctx.strokeStyle="#ff79aa";ctx.lineWidth=6;ctx.setLineDash([10,8]);
 ctx.beginPath();ctx.arc(BX(),BY()-15,85,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);
 arrow(W*.82,H*.40,BX()+65,BY()-80)
}
 if(stage===4){arrow(W*.82,H*.37,W*.29,H*.53)}
 if(stage===6){arrow(W*.79,H*.32,W*.48,H*.62)}
}
function drawTransition(){
 if(!transition)return false;
 let t=Math.min(1,(performance.now()-transition.start)/transition.duration),e=t*t*(3-2*t),bx=BX(),by=BY();
 bg();
 if(transition.type==="egg"){bowl();egg(bx+105,by-80);let yy=by-80+(by-(by-80))*e;ctx.fillStyle="#fffdf3c8";ctx.beginPath();ctx.ellipse(bx+65*(1-e),yy-8,31,43,0,0,Math.PI*2);ctx.fill();ctx.fillStyle="#ffc52d";ctx.beginPath();ctx.arc(bx+65*(1-e),yy,18,0,Math.PI*2);ctx.fill()}
 if(transition.type==="milk"){bowl();ctx.strokeStyle="#fff";ctx.globalAlpha=.7*(1-e);ctx.lineWidth=8;for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(bx,by-10,55+i*18+e*15,0,Math.PI*2);ctx.stroke()}ctx.globalAlpha=1}
 if(transition.type==="flour"){bowl();ctx.fillStyle="#fff3d9";ctx.globalAlpha=1-e;for(let i=0;i<24;i++){ctx.beginPath();ctx.arc(bx-80+Math.random()*160,by-30+Math.random()*70,3,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1}
 if(transition.type==="mix"){bowl();ctx.fillStyle="#efd38c";ctx.beginPath();ctx.ellipse(bx,by-10,112,27,0,0,Math.PI*2);ctx.fill()}
 if(transition.type==="pour"){pan();pancake(H*.67,.05,1+e*.04)}
 if(transition.type==="cook"){stovePan(W*.48,H*.70,true);pancakeAt(W*.48,H*.69,.86,1)}
 if(transition.type==="flip"){stovePan(W*.48,H*.70,true);let lift=Math.sin(t*Math.PI)*145,rot=t*Math.PI*2;ctx.save();ctx.translate(W*.48,H*.69-lift);ctx.rotate(rot);let grad=ctx.createRadialGradient(-20,-10,15,0,0,105);grad.addColorStop(0,"#e4b666");grad.addColorStop(1,"#b66f32");ctx.fillStyle=grad;ctx.beginPath();ctx.ellipse(0,0,102,36,0,0,Math.PI*2);ctx.fill();ctx.restore();spatula(W*.48+80*(1-e),H*.69+35*(1-e),-.2)}
 if(t>=1&&!transitionFinishQueued){transitionFinishQueued=true;setTimeout(finishTransition,60)}
 return true
}

function draw(){
 let now=performance.now(),dt=Math.min(35,now-lastFrame);lastFrame=now;
 if(drawTransition()){requestAnimationFrame(draw);return}
 bg();let bx=BX(),by=BY();

 if(stage===0){
  bowl();let tx=bx+105,ty=by-22;pulse(tx,ty,25);
  let x=drag?.kind==="egg"?drag.x:W*.80,y=drag?.kind==="egg"?drag.y:H*.35;egg(x,y)
 }
 if(stage===1){
  bowl();let x=drag?.kind==="milk"?drag.x:W*.81,y=drag?.kind==="milk"?drag.y:H*.31,r=drag?.rot||0;if(!drag)toolGlow(W*.81,H*.31,90);milk(x,y,r);
  if(drag?.pouring){
    ctx.strokeStyle="#f8fdff";ctx.lineWidth=13;ctx.lineCap="round";
    ctx.beginPath();ctx.moveTo(drag.sx,drag.sy);ctx.lineTo(drag.sx,drag.ty);ctx.stroke()
  }
 }
 if(stage===2){
  bowl();let x=drag?.kind==="flour"?drag.x:W*.81,y=drag?.kind==="flour"?drag.y:H*.31;if(!drag)toolGlow(W*.81,H*.31,92);flour(x,y);
  if(drag?.pouring){ctx.fillStyle="#fff0d1";for(let i=0;i<15;i++){ctx.beginPath();ctx.arc(x-22+Math.random()*44,y+58+Math.random()*95,3,0,Math.PI*2);ctx.fill()}}
 }
 if(stage===3){
  bowl();
  const inBowl=drag?.kind==="whisk"&&Math.abs(drag.x-BX())<125&&drag.y>BY()-150&&drag.y<BY()+10;
  let x=drag?.kind==="whisk"?drag.x:W*.82;
  let y=drag?.kind==="whisk"?drag.y:H*.40;
  if(!drag)toolGlow(W*.82,H*.40,88);
  if(inBowl){
    x=Math.max(BX()-82,Math.min(BX()+82,x));
    y=BY()-72;
  }
  whisk(x,y,inBowl);
  if(inBowl){
    ctx.fillStyle="#f1d78f";ctx.globalAlpha=.45;
    ctx.beginPath();ctx.ellipse(BX(),BY()-8,100,22,0,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1
  }
 }
 if(stage===4){
  const bowlX=W*.28,bowlY=H*.55,panX=W*.57,panY=H*.75;
  bowlAt(bowlX,bowlY,.82);
  stovePan(panX,panY,true);
  let x=drag?.kind==="ladle"?drag.x:W*.82,y=drag?.kind==="ladle"?drag.y:H*.38;
  if(!drag)toolGlow(W*.82,H*.38,92);
  let overPan=drag?.kind==="ladle"&&near({x:drag.x,y:drag.y},panX,panY-45,165);
  if(overPan&&S.pour.hasBatter){
    ctx.save();ctx.translate(x,y);ctx.rotate(-.72);ctx.translate(-x,-y);ladle(x,y,true);ctx.restore();
    // visible batter stream from ladle to the pan
    ctx.strokeStyle="#edcf87";ctx.lineWidth=16;ctx.lineCap="round";
    ctx.beginPath();ctx.moveTo(x-18,y+42);ctx.lineTo(x-18,panY-8);ctx.stroke()
  }else{
    ladle(x,y,S.pour.hasBatter)
  }
  if(S.pour.level>0)pancakeAt(panX,panY-10,.04,Math.max(.35,S.pour.level/100));
 }
 if(stage===5){
  const panX=W*.48,panY=H*.70;
  stovePan(panX,panY,true);
  if(Math.random()<.06)soundSizzle();
  if(Math.random()<.025)soundFlame();
  S.cook.level=Math.min(100,S.cook.level+dt*.0065);meter(S.cook.level);
  pancakeAt(panX,panY-10,S.cook.level/115,1);
  for(let i=0;i<Math.floor(S.cook.level/8);i++){
    ctx.fillStyle="#fff0ad";ctx.beginPath();
    ctx.arc(panX-66+(i*17)%132,panY-18+(i%2)*10,4,0,Math.PI*2);ctx.fill()
  }
  if(S.cook.level>=100&&!locked)beginTransition("cook",1350)
 }
 if(stage===6){
  const panX=W*.48,panY=H*.70;
  stovePan(panX,panY,true);pancakeAt(panX,panY-10,.86,1);
  let x=drag?.kind==="spatula"?drag.x:W*.82,y=drag?.kind==="spatula"?drag.y:H*.39;
  if(!drag)toolGlow(W*.82,H*.39,90);spatula(x,y,drag?.r||0)
 }
 if(stage===7){
  if(!S.decor.honeyDone){
    S.decor.honeyIntro=Math.min(100,S.decor.honeyIntro+0.55);
    S.decor.honey=S.decor.honeyIntro;
    meter(S.decor.honeyIntro);
    if(S.decor.honeyIntro>=100){S.decor.honeyDone=true;locked=false;stageStart=performance.now();meter(0)}
  }
  ctx.fillStyle="#bce6fa";ctx.beginPath();ctx.ellipse(W/2,H*.71,W*.49,100,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#fff";ctx.beginPath();ctx.ellipse(W/2,H*.70,W*.44,86,0,0,Math.PI*2);ctx.fill();
  for(let k=0;k<3;k++){let yy=H*.64-k*33;let grad=ctx.createRadialGradient(W*.45,yy-10,15,W/2,yy,150);grad.addColorStop(0,"#e9bd72");grad.addColorStop(1,"#c98c43");ctx.fillStyle=grad;ctx.beginPath();ctx.ellipse(W/2,yy,W*.37,41,0,0,Math.PI*2);ctx.fill()}
  if(S.decor.honey>0){
    let h=Math.min(1,S.decor.honey/100);
    ctx.fillStyle="#d99820";ctx.globalAlpha=.18+.64*h;
    ctx.beginPath();ctx.ellipse(W/2,H*.55,W*.29,25,0,0,Math.PI*2);ctx.fill();
    ctx.fillRect(W*.29,H*.56,W*.04,55*h);ctx.fillRect(W*.60,H*.56,W*.035,43*h);ctx.fillRect(W*.48,H*.565,W*.03,35*h);
    ctx.globalAlpha=1
  }

  // smaller palette, more choices
  let types=["strawberry","banana","blueberry","chocolate","cream","butter","kiwi","raspberry","cookie","broccoli","fish","onion"];
  let cols=6;
  for(let i=0;i<types.length;i++){
    let col=i%cols,row=Math.floor(i/cols),x=W*(.075+col*.17),y=H*(.205+row*.082);
    ctx.fillStyle=S.decor.selected===types[i]?"#fff0a8":"#ffffffdf";ctx.beginPath();ctx.arc(x,y,24,0,Math.PI*2);ctx.fill();
    topping(types[i],x,y,.68)
  }
  S.decor.items.forEach(o=>topping(o.type,o.x,o.y,o.s||.78));

  if(!S.decor.honeyDone){
    let p=S.decor.honeyIntro/100;
    let bx=W*(.72-.18*Math.sin(p*Math.PI*2)), by=H*.39;
    let angle=-.95 + .10*Math.sin(p*Math.PI*3);
    syrupBottle(bx,by,angle);
    // thick, slightly wavy syrup that stretches downward from the tipped spout
    let sx=bx-38, sy=by+18, ex=W/2+Math.sin(p*8)*W*.10, ey=H*.555;
    ctx.strokeStyle="#d99820";ctx.lineWidth=10;ctx.lineCap="round";
    ctx.beginPath();ctx.moveTo(sx,sy);
    ctx.bezierCurveTo(sx-8,sy+45,ex+16,ey-55,ex,ey);ctx.stroke();
    ctx.fillStyle="#d99820";ctx.beginPath();ctx.arc(ex,ey+7+Math.sin(p*14)*3,7,0,Math.PI*2);ctx.fill()
  }
 }

 updateGuide();
 hint();
 requestAnimationFrame(draw)
}

function pt(e){let r=c.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
function near(q,x,y,r){return Math.hypot(q.x-x,q.y-y)<r}

c.onpointerdown=e=>{
 if(locked||transition)return;let q=pt(e);c.setPointerCapture(e.pointerId);stageStart=performance.now();

 if(stage===0&&near(q,W*.80,H*.35,130))drag={kind:"egg",x:q.x,y:q.y};
 else if(stage===1&&near(q,W*.81,H*.31,135))drag={kind:"milk",x:q.x,y:q.y,rot:0};
 else if(stage===2&&near(q,W*.81,H*.31,140))drag={kind:"flour",x:q.x,y:q.y};
 else if(stage===3&&near(q,W*.82,H*.40,145))drag={kind:"whisk",x:q.x,y:q.y,a:null,total:0};
 else if(stage===4&&near(q,W*.82,H*.38,145))drag={kind:"ladle",x:q.x,y:q.y};
 else if(stage===6&&near(q,W*.82,H*.39,145))drag={kind:"spatula",x:q.x,y:q.y,inserted:false};

 else if(stage===7&&S.decor.honeyDone){
   let types=["strawberry","banana","blueberry","chocolate","cream","butter","kiwi","raspberry","cookie","broccoli","fish","onion"];
   let hitType=null;
   types.forEach((t,i)=>{let col=i%6,row=Math.floor(i/6),x=W*(.075+col*.17),y=H*(.205+row*.082);if(near(q,x,y,30))hitType=t});
   if(hitType){S.decor.selected=hitType;soundTap();msg("✨")}
   else if(S.decor.selected&&q.y>H*.40&&q.y<H*.80){let o={type:S.decor.selected,x:q.x,y:q.y,s:.78};S.decor.items.push(o);drag={kind:"decor",o}}
 }
};

c.onpointermove=e=>{
 if(!drag||locked||transition)return;let q=pt(e),bx=BX(),by=BY();drag.x=q.x;drag.y=q.y;

 if(drag.kind==="egg"){
  let tx=bx+105,ty=by-22,bottomY=q.y+52,d=Math.hypot(q.x-tx,bottomY-ty);
  if(d>74)S.egg.armed=true;
  if(d<29&&S.egg.armed&&performance.now()-S.egg.lastHit>430){
   S.egg.armed=false;S.egg.lastHit=performance.now();S.egg.hits++;meter(S.egg.hits*28);beep(175+S.egg.hits*35,.06,.02,"square");
   if(S.egg.hits>=3){S.egg.opened=true;drag=null;beginTransition("egg",1650)}
  }
 }

 if(drag?.kind==="milk"){
  // Pack and stream are physically linked: the stream begins at the drawn spout
  // and always falls VERTICALLY from that x-position.
  const aboveBowl = q.y < by-75;
  drag.rot = aboveBowl ? -0.88 : 0;
  let cs=Math.cos(drag.rot),sn=Math.sin(drag.rot);
  // local spout point of carton after rotation
  drag.sx=q.x+(-13*cs)-(-69*sn);
  drag.sy=q.y+(-13*sn)+(-69*cs);
  drag.ty=by-12;
  const landsInBowl = aboveBowl && drag.sx>bx-112 && drag.sx<bx+112 && drag.sy<by-45;
  drag.pouring=aboveBowl;
  if(landsInBowl){
    S.score.milkGood++;
    if(Math.random()<.18)soundPour();
    S.milk.level=Math.min(100,S.milk.level+.28);meter(S.milk.level);
    if(S.milk.level>=100)beginTransition("milk",1300)
  }else if(aboveBowl&&drag.pouring){
    S.score.milkBad++;
    if(S.score.milkBad%28===0)S.score.penalty+=1
  }
 }

 if(drag?.kind==="flour"){
  drag.pouring=near(q,bx+100,by-165,205);
  if(drag.pouring){if(Math.random()<.12)beep(155,.03,.008,"triangle");S.flour.level=Math.min(100,S.flour.level+.36);meter(S.flour.level);if(S.flour.level>=100)beginTransition("flour",1350)}
 }

 if(drag?.kind==="whisk"){
  let dx=q.x-bx,dy=q.y-by,inside=Math.abs(dx)<125&&dy>-150&&dy<15;
  if(inside){
    let a=Math.atan2(dy,dx);
    if(drag.a!==null){let d=Math.abs(a-drag.a);if(d>Math.PI)d=2*Math.PI-d;if(d<1.20)drag.total+=d}
    drag.a=a;S.mix.level=Math.min(100,drag.total*2.15);meter(S.mix.level);
    if(performance.now()-S.mix.lastSound>90){S.mix.lastSound=performance.now();soundMix()}
    if(S.mix.level>=100)beginTransition("mix",1650)
  }else drag.a=null
 }

 if(drag?.kind==="ladle"){
  const bowlX=W*.28,bowlY=H*.55,panX=W*.57,panY=H*.75;
  const bowlHit=near(q,bowlX,bowlY-5,118);
  const panHit=near(q,panX,panY-45,170);
  if(bowlHit&&!S.pour.hasBatter){
    S.pour.loaded=Math.min(100,S.pour.loaded+2.4);
    meter(Math.min(45,S.pour.loaded*.45));
    if(performance.now()-S.pour.lastSound>140){S.pour.lastSound=performance.now();soundScoop()}
    if(S.pour.loaded>=100){S.pour.hasBatter=true;msg("✨");soundPlop()}
  }
  if(S.pour.hasBatter&&panHit){
    S.pour.level=Math.min(100,S.pour.level+1.2);meter(45+S.pour.level*.55);
    if(performance.now()-S.pour.lastSound>110){S.pour.lastSound=performance.now();soundPour()}
    if(S.pour.level>=100)beginTransition("pour",1500)
  }
 }

 if(drag?.kind==="spatula"){
  const panX=W*.48,panY=H*.70;
  let under=Math.abs(q.x-panX)<145&&q.y>panY-70&&q.y<panY+35;
  if(under){drag.inserted=true;S.flip.insert=Math.min(100,S.flip.insert+1.0);meter(Math.min(70,S.flip.insert))}
  if(drag.inserted&&q.y<panY-150&&S.flip.insert>35){drag=null;beginTransition("flip",1550)}
 }

 if(drag?.kind==="decor"){drag.o.x=q.x;drag.o.y=q.y}
};

c.onpointerup=e=>{
 if(!drag)return;let q=pt(e);
 if(drag.kind==="decor"){if(!(q.y>H*.43&&q.y<H*.80))S.decor.items.pop()}
 drag=null;stageStart=performance.now()
};


document.querySelector("#undoBtn").onclick=()=>{
 if(stage!==7||S.decor.done)return;
 if(S.decor.items.length){S.decor.items.pop();S.decor.undos++;S.score.penalty+=2;beep(420,.04);msg("↶")}
};
document.querySelector("#finishBtn").onclick=()=>{
 if(stage!==7||!S.decor.honeyDone||S.decor.done)return;
 S.decor.done=true;decorControls.style.display="none";meter(100);beep(980,.10);
 let variety=new Set(S.decor.items.map(o=>o.type)).size;
 // 100点固定にならないよう、操作ミス・やり直し・盛り付けの種類を評価に反映
 let score=Math.max(55,Math.min(100,94-S.score.penalty-Math.max(0,4-variety)*3+Math.min(6,variety)));
 let rank=score>=95?5:score>=88?4:score>=80?3:score>=70?2:1;
 const gear=["👗","👗 👠","👗 👠 📿","👗 👠 📿 👑","👗 👠 📿 👑 🪄"];
 const names=["かわいいドレス","プリンセスシューズ","きらきらネックレス","ロイヤルティアラ","まほうのステッキ"];
 princessAvatar.textContent=rank>=4?"👸":"👧";
 accessories.textContent=gear[rank-1];
 sparkles.style.display=rank>=4?"block":"none";
 resultTitle.textContent=rank===5?"ロイヤル・プリンセス！":rank>=4?"プリンセス・シェフ！":rank>=3?"すてきなプリンセス！":"プリンセスにちかづいた！";
 resultText.textContent="♛ "+score+"てん　おりょうりできたよ！";
 unlockText.textContent="GET！ "+names.slice(0,rank).join("・");
 finalCard.style.display="block";
};
document.querySelector("#againBtn").onclick=()=>location.reload();

document.querySelector("#snd").onclick=e=>{sound=!sound;e.currentTarget.textContent=sound?"♪":"×";beep(700)};
document.querySelector("#home").onclick=()=>location.reload();
setDots();updateGuide();requestAnimationFrame(draw);
</script>
