<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Princess Kitchen Story v61</title>
<style>
:root{
  --pink:#f45c94;
  --pink2:#ff9dc0;
  --cream:#fff9f3;
  --ink:#6f4858;
  --gold:#e6b24b;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#f7d7e5;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}
body{display:grid;place-items:center}
#game{
  position:relative;
  width:min(100vw,calc(100dvh * 2 / 3));
  height:min(100dvh,calc(100vw * 3 / 2));
  overflow:hidden;
  background:linear-gradient(#ffddea,#ffeef5 50%,#efbe8c 50%,#d89a65);
  box-shadow:0 0 0 1px #fff4 inset;
}
svg{position:absolute;inset:0;width:100%;height:100%}
#hud{position:absolute;inset:0;pointer-events:none}
#topbar{
  position:absolute;left:3%;right:3%;top:2.2%;height:9.4%;
  display:grid;grid-template-columns:64px 1fr 64px;align-items:start;gap:10px;
}
.circle{
  pointer-events:auto;width:56px;height:56px;border:0;border-radius:50%;
  background:linear-gradient(#ff83ae,#ef4d8b);color:white;font-size:28px;font-weight:900;
  box-shadow:0 7px 20px #9e285a55,inset 0 0 0 4px #fff8;
}
#stageCard{
  justify-self:center;width:88%;min-height:66px;border-radius:23px;
  background:#fff9;border:2px solid #efb5c8;box-shadow:0 7px 18px #9e45662e;
  text-align:center;padding:7px 10px 9px;
}
#stageText{font-size:17px;font-weight:1000;color:#3f3438;line-height:1.1}
#dots{display:flex;justify-content:center;gap:7px;margin-top:7px}
.dot{width:11px;height:11px;border-radius:50%;border:2px solid #e598b4;background:#fff}
.dot.on{background:#f23e82;border-color:#f23e82;box-shadow:0 0 0 4px #ffdce8}
#progress{
  position:absolute;left:11%;right:11%;top:10.6%;height:11px;border-radius:10px;
  background:#fff9;border:2px solid #fff;overflow:hidden;box-shadow:0 4px 10px #a24c6a20;
}
#progressFill{height:100%;width:10%;background:linear-gradient(90deg,#ffc93c,#ff5c9d);transition:width .55s ease}
#brand{
  position:absolute;left:50%;top:12.5%;transform:translateX(-50%);
  background:#fff9;border:2px solid #e8c76e;border-radius:22px;padding:7px 22px;
  font-weight:1000;letter-spacing:1.2px;color:#e0417d;box-shadow:0 5px 15px #9d476128;
  white-space:nowrap;
}
#guide{
  position:absolute;left:5%;right:5%;top:16.2%;min-height:64px;padding:10px 14px;
  border-radius:24px;background:#fffaf3ed;border:2px solid #efb2c8;
  color:#9b3f61;font-size:14px;line-height:1.38;text-align:center;font-weight:900;
  box-shadow:0 7px 18px #94466126;
}
#tray{
  position:absolute;left:2%;right:2%;bottom:1.4%;height:13.3%;
  display:flex;align-items:center;justify-content:space-around;gap:3px;padding:7px 8px;
  border-radius:28px;background:linear-gradient(#fff9,#ffd9e8ee);
  border:2px solid #f1abc3;box-shadow:0 9px 22px #8f405e3b,inset 0 0 0 2px #fff7;
  transform:translateY(120%);transition:transform .6s cubic-bezier(.2,.8,.2,1);
}
#tray.show{transform:translateY(0)}
.item{
  position:relative;width:15.3%;height:90%;border:0;border-radius:18px;
  background:transparent;padding:0;transition:.2s;pointer-events:auto;
}
.item.active{background:#fff8;box-shadow:0 0 0 4px #fff,0 0 26px 9px #ffe266}
.item.done{opacity:.62}
.item svg{position:static;width:100%;height:100%}
.item:active{transform:scale(.94)}
#counter{
  position:absolute;left:50%;bottom:16.1%;transform:translateX(-50%);
  padding:8px 17px;border-radius:22px;background:#fff9;color:#9d4866;
  font-size:18px;font-weight:1000;box-shadow:0 5px 16px #8e405d32;display:none;
}
#topChoices{
  position:absolute;left:3%;right:3%;bottom:16%;display:none;justify-content:center;gap:7px;flex-wrap:wrap;
}
.top{
  width:58px;height:58px;border:2px solid #f3b5cb;border-radius:50%;background:#fff9;
  box-shadow:0 5px 13px #8c3f5c27;padding:4px;pointer-events:auto;
}
.top svg{position:static;width:100%;height:100%}
#finish{
  display:none;position:absolute;right:3.8%;bottom:16.3%;pointer-events:auto;
  border:0;border-radius:25px;padding:12px 18px;background:linear-gradient(#ff79a9,#ed4c88);
  color:white;font-size:17px;font-weight:1000;box-shadow:0 6px 16px #a72b6052;
}
#reward{
  display:none;position:absolute;inset:0;z-index:30;background:linear-gradient(#fff6eedf,#ffd8e8ef);
  backdrop-filter:blur(3px);
}
#rewardCard{
  position:absolute;left:4.5%;right:4.5%;top:6.5%;bottom:6%;border-radius:34px;
  background:#fffdf7;border:4px solid #efc36c;box-shadow:0 16px 48px #99536f3e;overflow:hidden;
}
#reward h1{margin:20px 0 0;text-align:center;color:#e44d82;font-size:29px}
#score{text-align:center;color:#f0a129;font-size:43px;font-weight:1000}
#stars{text-align:center;font-size:34px;letter-spacing:8px}
#again{
  position:absolute;right:5%;top:18%;border:0;border-radius:24px;padding:12px 18px;
  background:#f05b92;color:white;font-size:16px;font-weight:1000;
}
#rewardText{
  position:absolute;left:5%;right:5%;bottom:4%;text-align:center;color:#995369;font-weight:900;
}
#version{
  position:absolute;right:2%;top:12.1%;padding:8px 11px;background:#db3f7d;color:#fff;
  border-radius:15px;font-weight:1000;box-shadow:0 5px 14px #9b24573d;
}
@keyframes wiggle{0%,100%{transform:translate(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.item.wrong{animation:wiggle .22s linear 2}
</style>
</head>

<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const bowl=$('#bowlGroup'), pan=$('#panGroup'), actor=$('#actorLayer'), decor=$('#decorLayer');
const batter=$('#batter'), lumps=$('#lumps'), pancake=$('#pancake');
const tray=$('#tray'), guide=$('#guide'), stageText=$('#stageText'), dots=$('#dots'), progressFill=$('#progressFill');
const counter=$('#counter'), choices=$('#topChoices'), finish=$('#finish');
const itemBtns=$$('.item');
let stage=0,locked=false,mixN=0,flipN=0,soundOn=true,decorated=[],batterState=0;

const stages=[
 ['mix','👑 ホットケーキミックスをタップ。袋がボウルまで飛んで、ゆっくりサラサラ入るよ。'],
 ['egg','👑 たまごをタップ。ボウルの上でパカッと割れて、そのまま入るよ。'],
 ['milk','👑 牛乳をタップ。パックが傾いて、ボウルへゆっくり注ぐよ。'],
 ['whisk','👑 泡立て器を3回タップ。混ぜるたびに生地の色とダマが少しずつ変わるよ。'],
 ['brush','👑 ハケをタップ。フライパンへ移動して、バターをぬるよ。'],
 ['ladle','👑 おたまをタップ。ボウルですくって、そのままフライパンへ流すよ。'],
 ['flip','👑 パンケーキを3回タップ。フライ返しでふわっとひっくり返そう！'],
 ['topping','👑 好きなトッピングをタップ。できたら「できあがり」を押そう！']
];

function setStage(n){
  stage=n; locked=false;
  stageText.textContent=`ステージ ${n+1}/8`;
  guide.textContent=stages[n][1];
  progressFill.style.width=`${(n+1)/8*100}%`;
  dots.innerHTML='';for(let i=0;i<8;i++){const d=document.createElement('i');d.className='dot'+(i===n?' on':'');dots.appendChild(d)}
  itemBtns.forEach((b,i)=>{b.classList.remove('active');b.classList.toggle('done',i<n&&n<6)});
  if(n<6){document.querySelector(`.item[data-key="${stages[n][0]}"]`)?.classList.add('active')}
  counter.style.display=(n===3||n===6)?'block':'none';
  if(n===3)counter.textContent=`${mixN}/3`; if(n===6)counter.textContent=`${flipN}/3`;
  choices.style.display=n===7?'flex':'none';finish.style.display=n===7?'block':'none';
}

function animate(el,frames,opts={duration:900,easing:'cubic-bezier(.2,.8,.2,1)',fill:'forwards'}){
  return el.animate(frames,opts).finished;
}
function sound(kind){
  if(!soundOn)return;
  try{
    const AC=window.AudioContext||window.webkitAudioContext;sound.ac ||= new AC();const ac=sound.ac;if(ac.state==='suspended')ac.resume();
    const o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);
    const f={pour:320,egg:500,mix:250,butter:220,scoop:280,flip:650,done:760,click:420}[kind]||400,now=ac.currentTime;
    o.type=kind==='mix'?'sine':'triangle';o.frequency.setValueAtTime(f,now);o.frequency.exponentialRampToValueAtTime(f*1.4,now+.13);
    g.gain.setValueAtTime(.001,now);g.gain.exponentialRampToValueAtTime(.14,now+.01);g.gain.exponentialRampToValueAtTime(.001,now+.2);
    o.start(now);o.stop(now+.22);
  }catch(e){}
}
function spark(x,y){
  for(let i=0;i<7;i++){
    const s=document.createElementNS('http://www.w3.org/2000/svg','text');
    s.textContent='✦';s.setAttribute('x',x+(Math.random()-.5)*120);s.setAttribute('y',y+(Math.random()-.5)*80);
    s.setAttribute('fill','#fff5a4');s.setAttribute('font-size','26');s.setAttribute('opacity','0');
    actor.appendChild(s);
    animate(s,[{opacity:0,transform:'scale(.6)'},{opacity:1,transform:'scale(1.2)'},{opacity:0,transform:'scale(.4)'}],{duration:700}).then(()=>s.remove());
  }
}
function makeUse(k){
  const btn=document.querySelector(`.item[data-key="${k}"] svg`);
  const clone=btn.cloneNode(true);
  clone.setAttribute('x','0');clone.setAttribute('y','0');clone.setAttribute('width','130');clone.setAttribute('height','170');
  const g=document.createElementNS('http://www.w3.org/2000/svg','g');
  g.appendChild(clone);actor.appendChild(g);return g;
}
function wrong(b){b.classList.add('wrong');setTimeout(()=>b.classList.remove('wrong'),500)}

async function intro(){
  await animate(bowl,[{transform:'translate(-520px,0)'},{transform:'translate(0,0)'}],{duration:850});
  tray.classList.add('show');
}
async function doMix(){
  locked=true;sound('pour');const g=makeUse('mix');
  await animate(g,[{transform:'translate(105px,1360px) rotate(0deg)'},{transform:'translate(420px,500px) rotate(-42deg)'}],{duration:950});
  for(let i=0;i<22;i++){
    const c=document.createElementNS('http://www.w3.org/2000/svg','circle');
    c.setAttribute('cx',500+Math.sin(i*1.9)*38);c.setAttribute('cy',590+(i%5)*10);c.setAttribute('r',3+(i%3));c.setAttribute('fill','#fff8ec');actor.appendChild(c);
    animate(c,[{transform:'translateY(0)',opacity:1},{transform:'translateY(260px)',opacity:.2}],{duration:520+Math.random()*240}).then(()=>c.remove());
  }
  await new Promise(r=>setTimeout(r,650)); g.remove();batterState=1;batter.setAttribute('fill','#f2dfb8');spark(355,850);setStage(1);
}
async function doEgg(){
  locked=true;sound('egg');const g=makeUse('egg');
  await animate(g,[{transform:'translate(225px,1360px)'},{transform:'translate(300px,540px)'}],{duration:850});
  const left=document.createElementNS('http://www.w3.org/2000/svg','ellipse'),right=left.cloneNode();
  left.setAttribute('cx',330);left.setAttribute('cy',620);left.setAttribute('rx',28);left.setAttribute('ry',42);left.setAttribute('fill','#fff2d8');left.setAttribute('stroke','#baa07d');left.setAttribute('stroke-width',4);
  right.setAttribute('cx',385);right.setAttribute('cy',620);right.setAttribute('rx',28);right.setAttribute('ry',42);right.setAttribute('fill','#fff2d8');right.setAttribute('stroke','#baa07d');right.setAttribute('stroke-width',4);
  actor.append(left,right);g.remove();
  await Promise.all([animate(left,[{transform:'rotate(0)'},{transform:'translate(-26px,-8px) rotate(-18deg)'}],{duration:350}),animate(right,[{transform:'rotate(0)'},{transform:'translate(26px,-8px) rotate(18deg)'}],{duration:350})]);
  const yolk=document.createElementNS('http://www.w3.org/2000/svg','circle');yolk.setAttribute('cx',357);yolk.setAttribute('cy',670);yolk.setAttribute('r',26);yolk.setAttribute('fill','#f4b214');actor.appendChild(yolk);
  await animate(yolk,[{transform:'translateY(0)'},{transform:'translateY(170px)'}],{duration:500});left.remove();right.remove();yolk.remove();batter.setAttribute('fill','#efd59b');spark(355,850);setStage(2);
}
async function doMilk(){
  locked=true;sound('pour');const g=makeUse('milk');
  await animate(g,[{transform:'translate(365px,1360px) rotate(0deg)'},{transform:'translate(420px,520px) rotate(-58deg)'}],{duration:900});
  const stream=document.createElementNS('http://www.w3.org/2000/svg','path');stream.setAttribute('d','M535 620 Q480 720 405 825');stream.setAttribute('fill','none');stream.setAttribute('stroke','#fffdf6');stream.setAttribute('stroke-width','18');stream.setAttribute('stroke-linecap','round');actor.appendChild(stream);
  await animate(stream,[{opacity:0},{opacity:1},{opacity:1},{opacity:0}],{duration:780});stream.remove();g.remove();batter.setAttribute('fill','#ead096');spark(355,850);setStage(3);
}
async function doWhisk(){
  locked=true;sound('mix');mixN++;
  const g=makeUse('whisk');
  await animate(g,[{transform:'translate(520px,1360px)'},{transform:'translate(300px,690px)'}],{duration:600});
  for(let i=0;i<3;i++)await animate(g,[{transform:'translate(300px,690px) rotate(-14deg)'},{transform:'translate(360px,690px) rotate(14deg)'},{transform:'translate(300px,690px) rotate(-14deg)'}],{duration:230});
  g.remove();
  const cols=['#e7cc8d','#e2c278','#ddb667'];batter.setAttribute('fill',cols[mixN-1]);
  const circles=[...lumps.querySelectorAll('circle')];circles.forEach((c,i)=>c.setAttribute('opacity',mixN===1?'.75':mixN===2?(i%2?'.25':'.55'):'0'));
  counter.textContent=`${mixN}/3`;spark(355,850);locked=false;if(mixN>=3)setStage(4);
}
async function bringPan(){
  await animate(pan,[{transform:'translate(520px,0)'},{transform:'translate(0,0)'}],{duration:700});
}
async function doBrush(){
  locked=true;sound('butter');await bringPan();const g=makeUse('brush');
  await animate(g,[{transform:'translate(680px,1360px)'},{transform:'translate(650px,900px) rotate(-35deg)'}],{duration:700});
  for(let i=0;i<2;i++)await animate(g,[{transform:'translate(600px,930px) rotate(-35deg)'},{transform:'translate(760px,930px) rotate(-20deg)'},{transform:'translate(600px,930px) rotate(-35deg)'}],{duration:350});
  g.remove();spark(730,1110);setStage(5);
}
async function doLadle(){
  locked=true;sound('scoop');const g=makeUse('ladle');
  await animate(g,[{transform:'translate(830px,1360px)'},{transform:'translate(300px,715px)'}],{duration:780});
  await animate(g,[{transform:'translate(300px,715px)'},{transform:'translate(300px,750px)'},{transform:'translate(300px,690px)'}],{duration:600});
  await animate(g,[{transform:'translate(300px,690px)'},{transform:'translate(670px,840px) rotate(18deg)'}],{duration:750});
  pancake.setAttribute('opacity','1');await animate(pancake,[{transform:'scale(.2)',transformOrigin:'730px 1110px'},{transform:'scale(1)',transformOrigin:'730px 1110px'}],{duration:550});g.remove();spark(730,1110);setStage(6);
}
async function doFlip(){
  if(locked)return;locked=true;sound('flip');flipN++;
  const sp=document.createElementNS('http://www.w3.org/2000/svg','g');
  sp.innerHTML='<rect x="575" y="1118" width="150" height="44" rx="10" fill="url(#metal)"/><rect x="690" y="1124" width="195" height="32" rx="16" fill="url(#pinkMetal)"/>';actor.appendChild(sp);
  await animate(sp,[{transform:'translateY(80px)'},{transform:'translateY(0)'}],{duration:300});
  await animate(pancake,[{transform:'translateY(0) rotate(0deg)',transformOrigin:'730px 1110px'},{transform:'translateY(-180px) rotate(180deg)',transformOrigin:'730px 1110px'},{transform:'translateY(0) rotate(360deg)',transformOrigin:'730px 1110px'}],{duration:720});
  sp.remove();counter.textContent=`${flipN}/3`;spark(730,1110);locked=false;if(flipN>=3)setStage(7);
}
function addTop(kind){
  if(stage!==7)return;sound('click');decorated.push(kind);
  const b=document.querySelector(`.top[data-top="${kind}"] svg`);const clone=b.cloneNode(true);clone.setAttribute('x',0);clone.setAttribute('y',0);clone.setAttribute('width',90);clone.setAttribute('height',90);
  const g=document.createElementNS('http://www.w3.org/2000/svg','g');g.appendChild(clone);decor.appendChild(g);
  const i=decorated.length-1,a=i*1.75,r=45+24*(i%3),x=730+Math.cos(a)*r,y=1080+Math.sin(a)*r*.42;
  g.setAttribute('transform',`translate(${x} ${y})`);spark(x,y);
}
function showReward(){sound('done');$('#reward').style.display='block'}
itemBtns.forEach(b=>b.onclick=()=>{if(locked)return;const k=b.dataset.key;if(stages[stage][0]!==k){wrong(b);return}({mix:doMix,egg:doEgg,milk:doMilk,whisk:doWhisk,brush:doBrush,ladle:doLadle}[k])()});
$('#game').addEventListener('click',e=>{if(stage===6&&!locked&&!e.target.closest('.item')&&!e.target.closest('#topbar'))doFlip()});
$$('.top').forEach(b=>b.onclick=e=>{e.stopPropagation();addTop(b.dataset.top)});
finish.onclick=showReward;
$('#sound').onclick=()=>{soundOn=!soundOn;$('#sound').textContent=soundOn?'♪':'×'};
$('#back').onclick=()=>{};
$('#again').onclick=()=>location.reload();
setStage(0);setTimeout(intro,250);
</script>
</body>
</html>
