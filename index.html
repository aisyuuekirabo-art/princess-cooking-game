<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ffd8e5">
<title>プリンセスキッチン・提案どおり版</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;background:#fff2f6;color:#7d314f}
body{display:flex;justify-content:center}
#app{width:min(100vw,430px);min-height:100svh;background:
radial-gradient(circle at 15% 8%,#fff 0 4px,transparent 5px),
linear-gradient(180deg,#ffe4ed 0%,#fff8fa 32%,#ffd9e4 100%);overflow:hidden;position:relative}
.top{padding:12px 14px 8px;text-align:center}
.logo{font-size:26px;font-weight:950;color:#ef4c83;text-shadow:0 2px 0 white}
.sub{font-size:12px;font-weight:800;color:#ae5b76;margin-top:2px}
.progress{display:flex;justify-content:center;gap:7px;margin:8px 0 2px}
.dot{width:10px;height:10px;border-radius:50%;background:#efb4c7;border:2px solid white;box-shadow:0 0 0 1px #e398b3}
.dot.on{background:#f44e88;transform:scale(1.2)}

.stageWrap{padding:0 12px}
.stage{position:relative;background:#fff;border:3px solid #f5b5ca;border-radius:24px;overflow:hidden;box-shadow:0 12px 30px rgba(177,71,111,.18);aspect-ratio:3/4}
.stage img{width:100%;height:100%;object-fit:cover;display:block}
.glow{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 35px rgba(255,255,255,.8)}
.caption{margin:10px 14px 6px;background:rgba(255,255,255,.92);border:2px solid #f5b5ca;border-radius:18px;padding:9px 12px;text-align:center;font-weight:900;font-size:14px;box-shadow:0 5px 16px rgba(177,71,111,.12)}

.controls{padding:7px 12px 18px}
.label{font-weight:950;font-size:14px;margin:4px 4px 8px;color:#d64175}
.items{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.item{border:2px solid #f5bbce;background:rgba(255,255,255,.95);border-radius:18px;min-height:74px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;color:#8c3e59;box-shadow:0 5px 12px rgba(169,73,110,.12);font-size:12px}
.item:active{transform:scale(.96)}
.item .ico{font-size:30px;line-height:1;margin-bottom:4px}
.item.hot{border-color:#ff5b92;box-shadow:0 0 0 4px rgba(255,91,146,.15),0 7px 17px rgba(169,73,110,.18)}
.item.disabled{opacity:.42;filter:grayscale(.3)}

.player{position:absolute;inset:0;background:#fff;display:none;z-index:10}
.player.show{display:block}
.player img{width:100%;height:100%;object-fit:cover}
.player .bar{position:absolute;left:7%;right:7%;bottom:5%;height:42px;border-radius:30px;background:rgba(71,28,45,.78);display:flex;align-items:center;padding:0 14px;color:white;font-weight:900}
.timeline{height:6px;background:rgba(255,255,255,.35);border-radius:4px;flex:1;margin-left:10px;overflow:hidden}
.timeline span{display:block;height:100%;background:#ff7eaa;width:0%}
.playBadge{width:32px;height:32px;border-radius:50%;background:#ff6c9f;display:grid;place-items:center}

.finish{display:none;position:absolute;inset:0;z-index:20;background:linear-gradient(#fff4f8,#ffdbe8);padding:20px;text-align:center}
.finish.show{display:flex;flex-direction:column}
.finish h2{margin:6px 0 10px;color:#e8437b;font-size:26px}
.cake{position:relative;flex:1;border-radius:24px;overflow:hidden;border:3px solid #f4b4c9;background:white;box-shadow:0 12px 28px rgba(169,73,110,.16)}
.cake img{width:100%;height:100%;object-fit:cover}
.topper{position:absolute;font-size:36px;transform:translate(-50%,-50%);filter:drop-shadow(0 3px 3px rgba(0,0,0,.18));animation:pop .2s ease-out}
@keyframes pop{from{transform:translate(-50%,-50%) scale(.2)}to{transform:translate(-50%,-50%) scale(1)}}
.finishItems{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.bigBtn{margin-top:10px;border:0;border-radius:22px;background:#f14e86;color:white;font-size:17px;font-weight:950;padding:13px 18px;box-shadow:0 6px 14px rgba(215,57,111,.25)}
.spark{position:absolute;color:#fff;font-size:22px;pointer-events:none;animation:fly .7s ease-out forwards}
@keyframes fly{to{transform:translateY(-70px) scale(1.5);opacity:0}}
</style>
</head>

const screen=document.getElementById('screen');
const player=document.getElementById('player');
const animFrame=document.getElementById('animFrame');
const timeline=document.getElementById('timeline');
const caption=document.getElementById('caption');
const dots=[...document.querySelectorAll('.dot')];
const buttons=[...document.querySelectorAll('#controls .item')];
let step=0,busy=false;

function chime(freq=520,dur=.12){
 try{
   const AC=window.AudioContext||window.webkitAudioContext; const ac=new AC();
   const o=ac.createOscillator(),g=ac.createGain(); o.frequency.value=freq;o.type='sine';
   g.gain.setValueAtTime(.04,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+dur);
   o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+dur);
 }catch(e){}
}

function setDot(n){dots.forEach((d,i)=>d.classList.toggle('on',i===n));}

async function playMix(){
 if(busy)return; busy=true; player.classList.add('show'); timeline.style.width='0%';
 for(let cycle=0;cycle<2;cycle++){
   for(let i=0;i<frames.length;i++){
     animFrame.src=frames[i];
     timeline.style.width=((cycle*frames.length+i+1)/(frames.length*2)*100)+'%';
     if(i===4)chime(300,.06);
     await new Promise(r=>setTimeout(r,145));
   }
 }
 await new Promise(r=>setTimeout(r,250));
 player.classList.remove('show');
 screen.src=phones[2];
 step=1;setDot(1);
 caption.textContent='次は、たまごをタップしてね！';
 buttons.forEach(b=>{b.classList.remove('hot','disabled')});
 buttons[1].classList.add('hot');
 buttons[2].classList.add('disabled');buttons[3].classList.add('disabled');
 busy=false;
}

async function playEgg(){
 if(busy||step!==1)return;busy=true;
 player.classList.add('show');
 animFrame.src=phones[3]; timeline.style.width='0%';
 for(let i=0;i<=30;i++){
   timeline.style.width=(i/30*100)+'%';
   if(i===10)chime(420,.08);
   if(i===20)chime(620,.08);
   await new Promise(r=>setTimeout(r,90));
 }
 player.classList.remove('show');
 step=2;setDot(2);
 caption.textContent='いい感じ！ 最後は自由にデコレーションしよう！';
 await new Promise(r=>setTimeout(r,350));
 document.getElementById('finish').classList.add('show');
 busy=false;
}

buttons.forEach(b=>b.addEventListener('click',()=>{
 const a=b.dataset.action;
 if(a==='mix'&&step===0)playMix();
 else if(a==='egg'&&step===1)playEgg();
 else if(b.classList.contains('disabled')){caption.textContent='この工程は次の完成版で追加するよ！';}
}));

const cake=document.getElementById('cake');
document.querySelectorAll('[data-top]').forEach(btn=>btn.addEventListener('click',()=>{
 const s=document.createElement('span');s.className='topper';s.textContent=btn.dataset.top;
 s.style.left=(25+Math.random()*50)+'%';s.style.top=(32+Math.random()*35)+'%';cake.appendChild(s);
 chime(700,.08);
}));
document.getElementById('done').onclick=()=>{
 caption.textContent='👑 できあがり！ とってもおいしそう！';
 for(let i=0;i<12;i++)setTimeout(()=>{
  const sp=document.createElement('div');sp.className='spark';sp.textContent='✨';
  sp.style.left=(10+Math.random()*80)+'%';sp.style.top=(30+Math.random()*45)+'%';
  document.getElementById('app').appendChild(sp);setTimeout(()=>sp.remove(),800);
 },i*70);
 chime(880,.4);
};
</script>
