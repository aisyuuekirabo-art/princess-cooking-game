<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>PRINCESS KITCHEN v55</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#fff4f8;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}
#app{height:100dvh;display:flex;flex-direction:column;background:linear-gradient(#fff8fc,#ffeef5)}
#top{height:122px;flex:0 0 122px;position:relative;padding:8px 18px 0}
#nav{display:flex;align-items:center;justify-content:space-between}
.round{width:52px;height:52px;border-radius:18px;border:0;background:#fff9;box-shadow:0 5px 18px #a4597440;font-size:25px}
#steps{position:absolute;top:16px;left:50%;transform:translateX(-50%);font-weight:900;color:#6e4d5d;font-size:14px}
#dots{display:flex;gap:7px;justify-content:center;margin-top:8px}
.dot{width:10px;height:10px;border-radius:50%;border:2px solid #e5a4bd;background:#fff}
.dot.on{background:#f34f8f;border-color:#f34f8f;box-shadow:0 0 0 4px #ffd9e7}
#guide{margin:6px auto 0;max-width:680px;background:#fffaf0e8;border-radius:22px;padding:10px 16px;text-align:center;font-weight:900;color:#7a4d5d;box-shadow:0 5px 18px #a45b7540;line-height:1.4;font-size:14px}
#scene{position:relative;flex:1;overflow:hidden;background:#ffdfe9}
.panel{position:absolute;inset:0;background-size:cover;background-position:center;transition:opacity .45s ease,transform .45s ease}
#glass{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,#fff5 0,#fff0 32%,#fff2 100%);mix-blend-mode:screen}
#tap{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);min-width:220px;padding:15px 26px;border:0;border-radius:28px;background:linear-gradient(180deg,#ff6aa2,#ed3f82);color:white;font-size:20px;font-weight:1000;box-shadow:0 8px 22px #b9326a55}
#tap:active{transform:translateX(-50%) scale(.97)}
#badge{position:absolute;right:14px;top:10px;background:#d93f80;color:white;border-radius:16px;padding:8px 13px;font-weight:1000;box-shadow:0 6px 16px #bd2d6a40}
#sparkles{position:absolute;inset:0;pointer-events:none}
.spark{position:absolute;color:#fff6a8;font-size:18px;animation:tw 1.2s ease-in-out infinite alternate}
@keyframes tw{from{opacity:.25;transform:scale(.75) rotate(0)}to{opacity:1;transform:scale(1.25) rotate(20deg)}}
#reward{display:none;position:absolute;inset:0;background-size:cover;background-position:center}
#rewardCard{position:absolute;left:8%;right:8%;bottom:8%;background:#fff8;border:2px solid #f0c669;border-radius:28px;padding:18px;text-align:center;backdrop-filter:blur(10px);box-shadow:0 12px 30px #9d5f7240}
#score{font-size:44px;font-weight:1000;color:#f15d87;text-shadow:0 2px #fff}
#stars{font-size:38px;letter-spacing:6px}
#again{margin-top:10px;border:0;border-radius:24px;background:#ff6297;color:#fff;padding:12px 26px;font-size:18px;font-weight:1000}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <div id="nav">
      <button class="round" id="back">←</button>
      <div id="steps">ステージ <span id="num">1</span>/6
        <div id="dots"></div>
      </div>
      <button class="round" id="sound">♪</button>
    </div>
    <div id="guide"></div>
  </div>
  <div id="scene">
    <div id="panel" class="panel"></div>
    <div id="glass"></div>
    <div id="sparkles"></div>
    <div id="badge">v55</div>
    <button id="tap">ここをタップ ✨</button>
    <div id="reward">
      <div id="rewardCard">
        <div style="font-size:24px;font-weight:1000;color:#b66a35">すてきなプリンセス！</div>
        <div id="score">82てん</div>
        <div id="stars">⭐⭐⭐</div>
        <div style="font-weight:900;color:#8b5b68;margin-top:5px">ティアラ・ネックレス・ドレス・シューズ GET！</div>
        <button id="again">もういちど</button>
      </div>
    </div>
  </div>
</div>

const guides=[
 "👑 おうちの人へ：ホットケーキミックスをタップ！ 自動でボウルに入るよ。",
 "👑 おうちの人へ：牛乳をタップ！ ゆっくりボウルへ注ぐよ。",
 "👑 おうちの人へ：泡立て器をタップ！ 3回混ぜると生地がなめらかになるよ。",
 "👑 おうちの人へ：フライパンをあたためて、バターをぬろう。",
 "👑 おうちの人へ：おたまで生地をすくって、フライパンへ入れるよ。",
 "👑 おうちの人へ：パンケーキをタップして3回ひっくり返そう！"
];
let stage=0, mixTap=0, flipTap=0, locked=false;
const panel=document.getElementById('panel'),guide=document.getElementById('guide'),num=document.getElementById('num'),dots=document.getElementById('dots'),tap=document.getElementById('tap'),reward=document.getElementById('reward');
function render(){
 panel.style.backgroundImage=`url("${art[stage]}")`;
 guide.textContent=guides[stage];
 num.textContent=stage+1;
 dots.innerHTML="";
 for(let i=0;i<6;i++){let d=document.createElement('i');d.className='dot'+(i===stage?' on':'');dots.appendChild(d)}
 tap.textContent=stage===2?`まぜる ${mixTap}/3 ✨`:stage===5?`ひっくり返す ${flipTap}/3 ✨`:"ここをタップ ✨";
}
function sparkle(){
 for(let i=0;i<10;i++){let s=document.createElement('span');s.className='spark';s.textContent='✦';s.style.left=(15+Math.random()*70)+'%';s.style.top=(18+Math.random()*65)+'%';s.style.animationDelay=(Math.random())+'s';document.getElementById('sparkles').appendChild(s);setTimeout(()=>s.remove(),1300)}
}
function next(){
 if(stage<5){stage++;mixTap=0;flipTap=0;panel.style.transform='scale(1.035)';setTimeout(()=>{panel.style.transform='scale(1)';render()},180)}
 else {
   reward.style.display='block';reward.style.backgroundImage=`url("${rewardArt}")`;tap.style.display='none';sparkle();
 }
}
tap.onclick=()=>{
 if(locked)return;
 locked=true;sparkle();
 if(stage===2){mixTap++;tap.textContent=`まぜる ${mixTap}/3 ✨`;setTimeout(()=>{locked=false;if(mixTap>=3)next()},520);return}
 if(stage===5){flipTap++;tap.textContent=`ひっくり返す ${flipTap}/3 ✨`;setTimeout(()=>{locked=false;if(flipTap>=3)next()},520);return}
 setTimeout(()=>{locked=false;next()},650)
};
document.getElementById('again').onclick=()=>{stage=0;mixTap=0;flipTap=0;reward.style.display='none';tap.style.display='block';render()};
document.getElementById('back').onclick=()=>{if(stage>0){stage--;render()}};
render();
</script>
</body></html>
